<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кофейная — приложение</title>
<meta property="og:title" content="Кофейная — приложение">
<meta property="og:description" content="Приходи чаще — плати меньше">
<meta property="og:image" content="https://kofeynaya.github.io/prototype/video/poster.jpg">
<meta property="og:video" content="https://kofeynaya.github.io/prototype/video/kofeynaya.mp4">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#172f28;color:#fef2e9;font-family:'Roboto Condensed',sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1100px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:20px}
h1{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(28px,6vw,52px);line-height:1.1}
h1 span{color:#a7d2b9}
video{width:100%;aspect-ratio:16/9;border-radius:18px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.btn{align-self:flex-start;display:inline-block;padding:14px 26px;border-radius:999px;background:#a7d2b9;color:#172f28;font-weight:700;font-size:19px;text-decoration:none}
.story{width:100%;max-width:360px;aspect-ratio:9/16;border-radius:18px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h2{font-size:26px;font-weight:700;margin-top:12px}
.note{font-size:14px;color:#a7d2b9;opacity:.75}
</style></head>
<body><main>
  <h1>Приходи чаще&nbsp;—<br><span>плати меньше</span></h1>
  <video src="kofeynaya.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  <h2>Для сторис</h2>
  <video class="story" src="kofeynaya-stories.mp4" poster="poster-stories.jpg" controls playsinline preload="metadata"></video>
  <a class="btn" href="../1/">Открыть прототип ›</a>
  <p class="note">Музыка: Sascha Ende, ende.app (CC&nbsp;BY&nbsp;4.0)</p>
</main></body></html>
