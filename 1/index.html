<meta charset="utf-8">
<base href="../"><!-- копия-эксперимент: картинки, меню и логотип берутся из основной папки -->
<title>Эксперимент · Кофейная лояльность</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Dela+Gothic+One&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Макет: одна колонка-телефон (до 440px), сверху демо-полоса, снизу таб-бар.
   Функциональное — чёрно-белое и спокойное; цвет только в «имиджевых» карточках (предложение, цены, награды). */
:root{
  --bg:#f9f9f9; --surface:#ffffff; --ink:#212221; --muted:#6a6e6b; --line:#e2e4e1;
  --green:#172f28; --sage:#a7d2b9; --pink:#ecccce; --cream:#fef2e9; --aqua:#9bd9d9; --teal:#00657f; --blue:#2b2b93;
  --on-color:#212221; --ok:#0d553f; --warn:#a24a1d;
  --tile:#212221; --tile-ink:#f9f9f9;
  --f-body:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191a19; --surface:#232523; --ink:#f3f4f2; --muted:#a3a7a3; --line:#363936;
  --ok:#7fc8a0; --warn:#f0a07a; --tile:#f3f4f2; --tile-ink:#191a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191a19; --surface:#232523; --ink:#f3f4f2; --muted:#a3a7a3; --line:#363936;
  --ok:#7fc8a0; --warn:#f0a07a; --tile:#f3f4f2; --tile-ink:#191a19; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* логотип: маска из PNG, окрашивается currentColor */
.logo{display:inline-block;background:currentColor;-webkit-mask:url(assets/wordmark.png) center/contain no-repeat;mask:url(assets/wordmark.png) center/contain no-repeat;aspect-ratio:1000/121}
.mark{display:inline-block;background:currentColor;-webkit-mask:url(assets/mark.png) center/contain no-repeat;mask:url(assets/mark.png) center/contain no-repeat;aspect-ratio:360/262}

/* демо-полоса */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--green);color:#f9f9f9;font-size:13px}
.demo b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;background:#f9f9f9;color:var(--green);padding:2px 6px;border-radius:4px}
.demo .date{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo button{padding:6px 10px;border-radius:999px;border:1px solid rgba(249,249,249,.4);font-size:13px;white-space:nowrap}
.demo button.primary{background:var(--sage);color:var(--on-color);border-color:var(--sage);font-weight:600}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.screen{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.link{color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* акцидентные цифры: белое на чёрном квадрате */
.tile{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .12em;background:var(--tile);color:var(--tile-ink);font-family:var(--f-num);line-height:1;font-variant-numeric:tabular-nums}
.tiles{display:inline-flex;gap:3px}

/* шапка главной */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hello .logo{width:150px;color:var(--ink)}

/* QR-карта */
.qrcard{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px}
.qrcard .mini{width:64px;height:64px;background:#f9f9f9;border-radius:8px;padding:6px;flex:none}
.qrcard .mini svg{width:100%;height:100%;display:block}
.qrcard .t{flex:1;min-width:0}
.qrcard .bal{font-size:13px;opacity:.75}

/* карточка предложения — «имиджевый» носитель: цвет + пятно */
.offer{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:var(--on-color);display:flex;flex-direction:column;gap:12px;min-height:220px}
.offer .blob{position:absolute;right:-40px;bottom:-50px;width:190px;height:190px;pointer-events:none}
.offer .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.8}
.offer .title{font-size:26px;line-height:1.05;font-weight:700;max-width:75%;text-wrap:balance}
.offer .val{font-family:var(--f-num);font-size:40px;line-height:1}
.offer .meta{font-size:14px;max-width:70%}
.offer .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;position:relative}
.offer .btn{background:var(--on-color);color:#f9f9f9}
.offer .btn.ghost{background:transparent;color:var(--on-color);border-color:var(--on-color)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(33,34,33,.1)}
.chip.on{background:var(--on-color);color:#f9f9f9}
.why{font-size:13px;opacity:.85;position:relative}

/* неделя */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day .dot{width:100%;aspect-ratio:1;max-width:44px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;color:var(--muted)}
.day.done .dot{background:var(--sage);border:0;color:var(--on-color)}
.day.today .dot{border:2px solid var(--ink);color:var(--ink)}
.day.today.done .dot{border:2px solid var(--ink)}
.day.future .dot{opacity:.45}
.goalbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
:root[data-theme="dark"] .goalbar i{background:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .goalbar i{background:var(--sage)}}

/* огоньки по неделям */
.flames{display:flex;gap:6px;flex-wrap:wrap}
.flame{width:30px;height:38px}
.flame path{fill:var(--line)}
.flame.lit path{fill:var(--warn)}

/* лестница наград */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.step .p{font-family:var(--f-num);font-size:18px}
.step .w{font-size:12px;color:var(--muted)}
.step.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.cur .w{color:inherit;opacity:.7}

/* персональные цены */
.prices{display:flex;flex-direction:column;gap:10px}
.price{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.price .sw{width:56px;height:56px;border-radius:12px;display:grid;place-items:center}
.price .sw svg{width:40px;height:40px}
.price .old{text-decoration:line-through;color:var(--muted);font-size:14px}
.price .new{font-family:var(--f-num);font-size:20px}

/* статистика */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:26px;line-height:1.1}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .f{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.funnel .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.funnel .bar i{display:block;height:100%;background:var(--teal)}
.funnel .n{text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .h:last-child{border-bottom:0}
.hist .h .d{font-size:13px;color:var(--muted);grid-column:1/-1}
.save{color:var(--ok)}

/* достижения */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.2}
.badge .b{width:52px;height:52px;display:grid;place-items:center;font-family:var(--f-num);font-size:20px;border-radius:50%}
.badge.off{opacity:.45}
.badge.off .b{background:var(--line)!important;color:var(--muted)!important}

/* «что я о вас знаю» */
.learn{display:flex;flex-direction:column;gap:8px}
.learn .l{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.learn .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.learn .bar i{display:block;height:100%;background:var(--green)}
.learn .l{grid-template-columns:1fr 32% 38px}.learn .l b{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.learn .l.top{font-weight:700}.learn .l.top b{color:var(--ink)}.learn .bar{height:10px;border-radius:5px}.learn .bar i{border-radius:5px}
.lr-hero{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(167,210,185,.18),rgba(236,204,206,.14));font-size:15px;line-height:1.3}
.lr-hero .lr-ic{font-size:30px;line-height:1;flex:none}
.lr-chips{display:flex;flex-wrap:wrap;gap:6px}
.lr-chips span{padding:5px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.lr-chips span.on{background:#a7d2b9;border-color:#a7d2b9;color:#212221;font-weight:700}
:root[data-theme="dark"] .learn .bar i{background:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .learn .bar i{background:var(--sage)}}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle:last-child{border-bottom:0}
.toggle input{width:44px;height:26px;accent-color:var(--green)}

/* таб-бар */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}

/* шторка */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain;touch-action:none}
/* пока открыто окно, страница под ним не прокручивается */
html.sheet-open,html.sheet-open body{overflow:hidden;overscroll-behavior:none}
html.sheet-open body{position:fixed;left:0;right:0;width:auto}   /* width:auto — отступы body остаются с обеих сторон, страница под окном не уезжает вправо (владелец 24.10) */
/* низ шторки (кол-во и цена) прилипает к самому краю экрана — без щели, сквозь которую видно содержимое */
.sheet-foot{position:sticky;z-index:4;--pb:calc(20px + env(safe-area-inset-bottom,0px));bottom:calc(-1 * var(--pb));margin:0 -16px calc(-1 * var(--pb));padding:10px 16px var(--pb);background:var(--bg);border-top:1px solid var(--line)}
.sheet{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sheet{width:100%;max-width:440px;max-height:88%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.goalbar i{transition:none}}
.sheet-x{position:sticky;top:0;align-self:flex-end;z-index:5;width:44px;height:44px;margin:-6px -4px -50px 0;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sheet-x svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.4;fill:none}
.menu{display:flex;flex-direction:column}
.mi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mi .nm{font-size:16px}
.mi .pr{font-size:14px;color:var(--muted)}
.mi .pr .pp{color:var(--ok);font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;line-height:1}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.sum .r.tot{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.bigqr{align-self:center;width:min(78vw,280px);aspect-ratio:1;background:#f9f9f9;border-radius:16px;padding:14px;position:relative}
.bigqr svg{width:100%;height:100%;display:block}
.bigqr .c{position:absolute;inset:0;margin:auto;width:22%;height:22%;background:#212221;border-radius:6px;display:grid;place-items:center}
.bigqr .c .mark{width:70%;color:#f9f9f9}
.timer{text-align:center;font-variant-numeric:tabular-nums}

/* тост */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(408px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast b{font-weight:700}
/* Обычные сообщения — фирменный зелёно-бирюзовый, не белый (владелец 24.10: белое выглядело «временным») */
.toast{background:linear-gradient(120deg,#0d553f,#00657f);color:#f9f9f9;border:1px solid rgba(167,210,185,.35);padding-left:16px;box-shadow:0 10px 28px rgba(0,101,127,.35)}
/* 25.10, с критиком: обычное уведомление — тёплый «эспрессо» из бренда, сверху под шапкой (зелёное сливалось с таб-баром и корзиной) */
.toast{top:calc(var(--gbar-h,50px) + env(safe-area-inset-top,0px) + 14px);bottom:auto!important;left:16px;right:16px;margin:0 auto;transform:none;width:fit-content;max-width:408px;
  background:linear-gradient(135deg,#382d2b,#4e3b35);color:#fef2e9;border:1px solid rgba(236,204,206,.45);border-radius:20px;padding:12px 18px;
  box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 4px rgba(56,45,43,.25);animation:toastDown .28s ease-out;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.toast small,.toast .muted{color:#ecccce}
@keyframes toastDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;animation:conf 2s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.party{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;color:#212221;background:linear-gradient(120deg,#f2c230,#ff8a65 55%,#ff4f9a);font-size:15px;line-height:1.35;box-shadow:0 8px 24px rgba(255,79,154,.3)}
.party .pe{font-size:34px;line-height:1}
.btn-party{background:linear-gradient(100deg,#f2c230,#ff8a65,#ff4f9a)!important;color:#212221!important;border:0!important;font-weight:800}
body:has(.app.has-cart) .toast{bottom:calc(148px + env(safe-area-inset-bottom,0px))} /* не закрывать плашку корзины */

/* вход */
.auth{flex:1;display:flex;flex-direction:column;gap:24px;padding:40px 16px 24px}
.auth .hero{background:var(--green);color:#f9f9f9;border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;min-height:250px}
.auth .hero .logo{width:200px;color:#f9f9f9}
.auth .hero p{font-size:19px;line-height:1.3;max-width:80%;position:relative}
.auth .hero .blob{position:absolute;right:-50px;bottom:-60px;width:220px;height:220px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:22px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.code input{text-align:center;font-family:var(--f-num);font-size:28px;letter-spacing:.5em;padding:12px 0 12px .5em}
.hint{font-size:14px;color:var(--muted)}
.rules{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px;margin:0}

/* v0.3: подписка, баланс, друг, 6-й, ДР */
.plus-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--blue);color:#f9f9f9;font-size:12px;font-weight:600;white-space:nowrap}
.locked{position:relative}
.locked .veil{filter:blur(3px);opacity:.5;pointer-events:none;user-select:none}
.locked .lockbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.lockbox .ic{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.lockbox .ic svg{width:20px;height:20px;fill:none;stroke:#f9f9f9;stroke-width:2}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);padding:4px 0}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:var(--r);color:var(--on-color);min-height:112px;position:relative;overflow:hidden}
.more button strong{font-size:17px;line-height:1.15;position:relative}
.more button span{font-size:13px;position:relative;opacity:.85}
.more button .blob{width:110px;height:110px;right:-30px;bottom:-40px}
.stamps{display:flex;flex-direction:column;gap:10px}
.six-rule{margin:0;font-size:14px;line-height:1.35}

/* ===== «Жидкое стекло» (как в iOS 26) — пробно только на «Сегодня» (.app.glass) =====
   Стекло — только у слоя управления, который плывёт над контентом: таб-бар, шапка, кнопки. Сам контент не стеклянный.
   Приёмы: размытие + усиление цвета под стеклом, светлый блик по верхней кромке, тонкая светлая рамка, мягкая тень, форма капсулы */
:root{--glass-bg:rgba(255,255,255,.68);--glass-line:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.9);--glass-shadow:0 10px 30px rgba(20,30,25,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass-bg:rgba(34,36,34,.66);--glass-line:rgba(255,255,255,.18);--glass-hi:rgba(255,255,255,.35);--glass-shadow:0 12px 34px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--glass-bg:rgba(34,36,34,.66);--glass-line:rgba(255,255,255,.18);--glass-hi:rgba(255,255,255,.35);--glass-shadow:0 12px 34px rgba(0,0,0,.45)}
.app.glass .tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:416px;margin:0 auto;padding:6px;border-radius:32px;border:1px solid var(--glass-line);
  background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(28px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 1.5px 0 0 rgba(255,255,255,.28),inset -1.5px 0 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.22),
    -10px 8px 22px -12px rgba(0,0,0,.45),10px 8px 22px -12px rgba(0,0,0,.45),0 14px 26px -18px rgba(0,0,0,.5)}
/* отражающий слой: блик сверху и по бокам; центр светлее (контрастный слой) */
.app.glass .tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%),linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,0) 12%,rgba(255,255,255,0) 88%,rgba(255,255,255,.12)),radial-gradient(60% 90% at 50% 55%,rgba(255,255,255,.06),rgba(255,255,255,0))}
.app.glass .tabs button{border-radius:24px;padding:7px 0;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.app.glass .tabs button[aria-current="page"]{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-line)}
.app.glass .tabs .qrtab .ring{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.7));color:#212221;border:1px solid rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);box-shadow:inset 0 1px 0 #fff,0 8px 22px rgba(0,0,0,.3)}
.app.glass .tabs .qrtab .ring svg{stroke:#212221}
.app.glass .tabs .qrtab[aria-current="page"],.app.glass .tabs .qrtab{background:none;box-shadow:none}
.app.glass main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.app.glass .offer .btn{position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.app.glass .offer .btn:not(.ghost){background:rgba(23,47,40,.78);color:#fff;border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.15),inset -1px 0 0 rgba(255,255,255,.15),0 8px 18px -6px rgba(13,85,63,.55)}
/* при нажатии стекло подсвечивается изнутри — свет собирается в центре, кнопка чуть «набухает», как капля */
.app.glass .offer .btn:active,.app.glass .tabs button:active{transform:scale(1.05);background-image:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0))}
.app.glass .offer .btn.ghost{background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.75);color:#212221;
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 16px rgba(0,0,0,.08)}
.app.glass .perk{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
/* --- «Жидкое стекло» на остальных вкладках: только элементы управления и навигации --- */
.app.glass .catbar,.app.glass .ser-pin{background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(180%) brightness(1.05);backdrop-filter:blur(24px) saturate(180%) brightness(1.05);border-bottom:1px solid var(--glass-line);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06),0 8px 18px -14px rgba(0,0,0,.5)}
.app.glass .modechip,.app.glass .iconbtn,.app.glass .softbtn,.app.glass .back{background:var(--glass-bg);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 6px 16px -8px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.app.glass .back{padding:7px 14px 7px 12px;border-radius:999px;color:var(--ink)}
.app.glass .modechip:active,.app.glass .iconbtn:active,.app.glass .softbtn:active,.app.glass .back:active,.app.glass .cartbar button:active{transform:scale(1.04);background-image:radial-gradient(closest-side,rgba(255,255,255,.4),rgba(255,255,255,0))}
.app.glass .cartbar{bottom:calc(94px + env(safe-area-inset-bottom,0px))}
.app.glass .cartbar button{background:radial-gradient(120% 140% at 30% 0%,rgba(110,148,128,.92),rgba(80,112,96,.9) 70%);border:1px solid rgba(255,255,255,.3);   /* 25.10 (владелец): светлый оттенок карты депозита — контрастнее, не сливается с тёмным фоном и таб-баром */
  border-radius:22px;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.14),0 10px 22px -8px rgba(13,85,63,.6);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.app.glass.has-cart main{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
body:has(.app.glass) .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body:has(.app.glass.has-cart) .toast{bottom:calc(166px + env(safe-area-inset-bottom,0px))}
body:has(.app.glass) .sheet-x{background:var(--glass-bg);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 16px -6px rgba(0,0,0,.4)}

.map .me{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--teal);border:3px solid #f9f9f9}
:root{--map:#dfe6e1;--road:#ffffff;--water:#b9d7df;--zone:rgba(23,47,40,.12);--zone-line:#172f28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map:#26302c;--road:#3a4540;--water:#1f3b45;--zone:rgba(167,210,185,.12);--zone-line:#a7d2b9}}
:root[data-theme="dark"]{--map:#26302c;--road:#3a4540;--water:#1f3b45;--zone:rgba(167,210,185,.12);--zone-line:#a7d2b9}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.li .radio.on{border:7px solid var(--ink)}
.li .th{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .tx small{color:var(--muted);font-size:13px}
.li .chev{color:var(--muted)}
.li svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
/* Важный пункт списка («Как всё устроено») — подсвечен только цвет шрифта, деликатный розовый */
:root{--hl:#d6336c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl:#ff9eb8}}
:root[data-theme="dark"]{--hl:#ff9eb8}
.li.hl{color:var(--hl)}
.li.hl .tx{font-weight:600}
.li.hl .tx small{color:var(--hl);opacity:.8;font-weight:400}
.li.hl .chev{color:var(--hl)}

.pd .ph{width:100%;aspect-ratio:1;border-radius:18px;margin-top:48px}
.optgroup{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optbtn{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:var(--surface)}
.optbtn.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.optbtn small{opacity:.7}
.when-row{display:grid;grid-template-columns:1fr}.when-row .optbtn{text-align:left;padding:12px 14px}   /* 25.10: обе кнопки одной ширины, края ровные */
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px;margin:6px 0 4px}
.wheel .w-band{position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);border-radius:12px;background:var(--surface);border:1.5px solid var(--line);pointer-events:none}
.wcol{position:relative;width:86px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;box-sizing:border-box;
  -webkit-mask:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:600 24px/1 var(--font,inherit);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer}
.wcol div.on{color:var(--ink);font-size:28px}
.w-colon{position:relative;font-size:26px}
.qtyrow{display:flex;align-items:center;gap:12px}
.qtyrow .qty button{width:40px;height:40px}
.hint-chip{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--cream);color:var(--on-color);font-size:14px}
.hint-chip .tile{font-size:14px}

.cartline{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cartline .ph{width:56px;height:56px;border-radius:10px}
.cartline .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.cartline small{color:var(--muted);font-size:13px}
.cartline .why{color:var(--ok);font-size:13px;font-weight:600}
.minbar{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.minbar .goalbar{height:6px}
.paym{display:flex;flex-direction:column;gap:8px}
.statusline{display:flex;flex-direction:column;gap:0}
.st{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding-bottom:14px;position:relative}
.st .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg);z-index:1}
.st.done .b{background:var(--ok);border-color:var(--ok)}
.st.cur .b{border:6px solid var(--ink)}
.st:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.st.done:not(:last-child)::before{background:var(--ok)}
.st .tx{display:flex;flex-direction:column}
.st .tx small{color:var(--muted)}
.bigcode{font-family:var(--f-num);font-size:56px;line-height:1}
.notice{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--green);color:#f9f9f9;font-size:14px}
.notice svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.lcard{border-radius:20px;padding:18px;background:var(--sage);color:var(--on-color);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.lcard .row{position:relative}
.lcard .pct{display:inline-grid;place-items:center;padding:8px 12px;border:2px solid var(--on-color);border-radius:12px;font-family:var(--f-num);font-size:22px}
.lcard .qrb{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(33,34,33,.12);font-weight:600}
.bell{position:relative}
.bell .n{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.search input{border:0;outline:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0}
.story.pic span{position:absolute;top:10px;left:10px;right:10px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.story.pic{border-color:var(--sage)}
.sheet > *{flex-shrink:0}
/* переход внутрь экрана — въезжает справа, «Назад» — слева (владелец 25.10: должно быть видно, что провалился) */
main.nav-fwd{animation:navFwd .3s cubic-bezier(.2,.8,.2,1)}main.nav-back{animation:navBack .3s cubic-bezier(.2,.8,.2,1)}
@keyframes navFwd{from{transform:translateX(34%);opacity:0}to{transform:none;opacity:1}}
@keyframes navBack{from{transform:translateX(-24%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){main.nav-fwd,main.nav-back{animation:none}}
/* шапка депозита внутри — без карты */
.wl-head{display:flex;flex-direction:column;gap:6px;padding:4px 2px 6px}.wl-h{margin:0 0 10px}
.wl-sum{font-family:var(--f-num);font-size:48px;line-height:1.02;white-space:nowrap!important;text-wrap:nowrap!important;letter-spacing:-.5px}.wl-sum .kop{opacity:.42}.wl-sum .cur{opacity:.6;font-size:.5em}
.wl-parts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}.wl-parts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rem{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}.rem-ic{font-size:44px;line-height:1}.rem h2{margin:0}.rem p{margin:0}
/* «Мой профиль» */
.me-hit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;flex:1;overflow:hidden;text-align:left;max-width:100%}.me-hit h1{max-width:100%}.me-hit .ph-num{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.me-top{display:flex;flex-direction:column;align-items:center;gap:8px}.me-top .myph{width:104px;height:104px}.me-top .myph .pl{font-size:40px}
.me-name{display:flex;gap:8px}.me-name .cp-in{flex:1;min-width:0}
/* Поддержка */
.inl-link{display:inline;padding:0;font:inherit;color:#7cc9a2;text-decoration:underline;text-underline-offset:3px}
.badge-n,.tab-dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#e53935;color:#fff;font-size:12px;font-weight:700;font-style:normal}
.tabs button{position:relative}.tab-dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px}
.sup{display:flex;flex-direction:column;gap:12px;min-height:100%}
.sup-h{display:flex;align-items:center;gap:12px;padding-right:48px}.sup-h span{display:flex;flex-direction:column}.sup-h b{font-size:20px}.sup-h small{color:var(--muted);font-size:13px;line-height:1.3}
.sup-ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0d553f,#00657f);display:grid;place-items:center;font-size:20px;flex:none}
.sup-ava svg{width:56%;height:56%;fill:none;stroke:#f9f9f9;stroke-width:1.9;stroke-linecap:round;display:block}
.sup-topics .sup-star{width:24px;height:24px}.smsg .sb .star-y{width:15px;height:15px;vertical-align:-2px;margin-right:2px}
.sup-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.sup-div::before,.sup-div::after{content:"";flex:1;height:1px;background:var(--line)}
.sup-no{align-self:center;color:var(--muted)}
.sup-new{align-self:flex-start;padding:7px 14px;border-radius:999px;border:1.5px solid #2e9e5b;color:#7cc9a2;font-weight:700;font-size:14px}
.smsg .sup-ava{width:30px;height:30px;font-size:15px}
.sup-list{flex:1;display:flex;flex-direction:column;gap:10px}
.smsg{display:flex;gap:8px;align-items:flex-end;max-width:88%}.smsg.me{align-self:flex-end}
.smsg .sb{padding:10px 13px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.smsg.me .sb{border-radius:16px 16px 4px 16px;background:#0d553f;border-color:#0d553f;color:#f9f9f9}
.smsg .sb small{font-size:11px;opacity:.65;align-self:flex-end}
.smsg.fail .sb{background:transparent;border:1px dashed #e53935;color:var(--ink)}
.sup-retry{margin-top:4px;color:#e53935;font-size:13px;font-weight:600;text-align:left}
.typing{flex-direction:row!important;align-items:center;gap:4px!important;color:var(--muted)}
.typing i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:tpDot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tpDot{0%,100%{opacity:.25}50%{opacity:1}}
.sup-q{margin:6px 0 0}
.sup-topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sup-topics button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:15px;text-align:left}
.sup-topics button span{font-size:24px;line-height:1}
.sup-orders{display:flex;flex-wrap:wrap;gap:8px;padding-left:38px}
.sup-orders button{display:flex;flex-direction:column;padding:9px 12px;border-radius:12px;border:1.5px solid #2e9e5b;text-align:left}.sup-orders small{color:var(--muted);font-size:12px}
.sup-note{align-self:center;text-align:center;font-size:14px;color:var(--muted);padding:6px 12px}
.sup-rate{display:flex;align-items:center;gap:8px;padding-left:38px}.sup-rate span{font-weight:700;margin-right:4px}
.sup-rate button{padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:700}.sup-rate button:first-of-type{background:#a7d2b9;border-color:#a7d2b9;color:#212221}
.sup-night{padding:10px 14px;border-radius:14px;background:rgba(43,43,147,.25);border:1px solid rgba(94,53,177,.5);font-size:14px;text-align:center;line-height:1.35}
.sup-in{position:sticky;bottom:0;display:flex;gap:8px;padding:8px 0 4px;background:var(--bg)}
.sup-in{align-items:flex-end}.sup-in textarea{resize:none;line-height:1.3;overflow-y:auto}
.sup-in textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sup-go{width:46px;height:46px;border-radius:50%;background:#2e9e5b;color:#fff;font-size:22px;font-weight:700;flex:none}.sup-go:disabled{background:var(--line);color:var(--muted)}
.toast.sup-toast{background:linear-gradient(120deg,#ad1457,#ff4f9a);border-color:rgba(255,255,255,.35);box-shadow:0 10px 28px rgba(214,38,79,.45);display:flex;align-items:center;justify-content:space-between;gap:10px}   /* ответ поддержки — розовый, не сливается с обычными (владелец 24.10) */
.toast.sup-toast .toast-btn{color:#ad1457;margin-left:0;flex:none}
.toast-btn{margin-left:10px;padding:5px 12px;border-radius:999px;background:#f9f9f9;color:#0d553f;font-weight:700;font-size:14px}
.ref-win{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px}.ref-win .rw-ic{font-size:56px;line-height:1;animation:rwHop .7s ease-out 2}@keyframes rwHop{0%,100%{transform:none}40%{transform:translateY(-10px) scale(1.08)}}   /* 25.10: без зелёной рамки (была пульсация-тень от другой кнопки) — просто подпрыгивают */.ref-win h2{margin:0;font-size:30px}.ref-win .rw-t{margin:0;font-size:17px}.ref-win .rw-go{align-self:stretch;justify-content:center}
.note{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}.note .ni{font-size:22px}.note .tx{flex:1;display:flex;flex-direction:column}.note small{color:var(--muted)}
.note .dot{width:10px;height:10px;border-radius:50%;background:#e53935}
/* 24.10: подарок, профиль гостя и переписка — на весь экран, без кусочка страницы сверху */
.sheet-bg.full{background:var(--bg)}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.offer.me{min-height:250px}
.offer.me .title,.offer.me .meta,.offer.me .why{max-width:57%;position:relative}
.offer.me .kicker{position:relative}
.offer .artwrap{position:absolute;right:-6px;top:34px;width:150px;height:170px;pointer-events:none;display:block}
.offer .art{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){.offer .art{animation:bob 3.2s ease-in-out infinite}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
:root{--star:#f2c230}
.batt{display:inline-flex;align-items:center}
.batt .bb{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:44px;height:22px;padding:2px;border:2px solid #212221;border-radius:5px}
.batt .bb i{border-radius:1px;background:transparent}
.batt .bb i.on{background:var(--bc)}
.batt .bt{width:3px;height:9px;margin-left:1px;border-radius:0 2px 2px 0;background:#212221}
.batt.big .bb{width:150px;height:56px;padding:4px;gap:4px;border-width:3px;border-radius:12px;border-color:var(--ink)}
.batt.big .bb i{border-radius:3px;background:var(--line)}
.batt.big .bb i.on{background:var(--bc)}
.batt.big .bt{width:7px;height:22px;background:var(--ink)}
@media (prefers-reduced-motion:no-preference){.batt .bb i.edge{animation:serblink 1.4s ease-in-out infinite}}
.myph{position:relative;width:44px;height:44px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--muted);color:var(--muted);cursor:pointer;overflow:hidden}
.myph .pl{font-size:24px;line-height:1;font-weight:300}
.ph-num{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.myph.has{border:0}
.myph img{width:100%;height:100%;object-fit:cover}
.myph.has{padding:0;background:none}
.crop{position:relative;align-self:center;overflow:hidden;border-radius:16px;touch-action:none;cursor:grab;background:#000}
.crop img{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none;transform-origin:0 0}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 200px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.9);outline-offset:-2px;pointer-events:none}
.crop-z{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--muted)}
.crop-z input{flex:1}
.crop-prev{display:flex;align-items:center;gap:12px}
.crop-prev .cp{position:relative;flex:none;border-radius:50%;overflow:hidden;background:var(--line)}
.crop-prev .cp img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
img.ava{object-fit:cover}
.ben{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
/* 24.10: депозит и бонусы — одна тема (деньги), «Выгода от приложения» — другая: перед ней больше воздуха */
.dash-st .ben-title{margin-top:18px;margin-bottom:-4px}
.ben-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ben-per{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.ben-per::-webkit-scrollbar{display:none}
.ben-per button{flex:1 1 auto;min-width:0;white-space:nowrap;padding:7px 6px;border-radius:999px;background:var(--line);font-size:12.5px;font-weight:700;color:var(--ink)}
.ben-per button.on{background:#2e9e5b;color:#fff;box-shadow:0 0 12px rgba(46,158,91,.5)}
.ben-dates{display:flex;gap:8px}
.ben-since{font-size:12.5px;color:var(--muted);margin-top:-2px;display:flex;align-items:center;gap:6px}
.bd-pick{flex:1;min-width:0;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;text-align:center}
.h-day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:13px;color:var(--muted);text-transform:none;border-bottom:1px solid var(--line)}.h-day b{color:var(--ink);font-size:14px}
.h-sum{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.h-sum span{color:var(--muted);font-size:14px}.h-sum b{font-size:20px;text-align:right}.h-sum small{grid-column:1/-1;font-size:13px}
.rate-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(46,158,91,.5);background:rgba(46,158,91,.1)}.rate-link .tx{flex:1;display:flex;flex-direction:column;gap:2px}.rate-link em{font-style:normal;color:var(--ok)}.rate-link small{color:var(--muted);font-size:13px}.rate-link .chev{font-size:22px;color:var(--muted)}
#hist-root{display:flex;flex-direction:column;gap:16px}#hist-root>h2{margin:0;min-height:44px;display:flex;align-items:center;padding-right:56px}   /* воздух между фильтром, датами и итогом; заголовок на высоте крестика */
#hist-root .h-sum{margin-bottom:4px}
.substrip{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:7px 14px;border-radius:12px;background:var(--prem);color:#fff;font-size:15px;text-align:left;margin-top:-6px}
.substrip .tx{flex:1;min-width:0}.substrip .chev{font-size:20px;opacity:.8}.substrip .ystar{color:#f2c230}
.substrip.warn{background:linear-gradient(100deg,#e53935,#ff7043)}.substrip.warn .go{padding:4px 12px;border-radius:999px;background:#fff;color:#c62828;font-weight:700;font-size:14px;white-space:nowrap}
.cmini{flex:none;width:46px;height:30px;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px;background:linear-gradient(135deg,#3a3a42,#1f1f24);color:#fff;font-size:8px;line-height:1;text-align:left}
.cmini.s2{background:linear-gradient(135deg,#0d553f,#2e9e5b)}.cmini.s4{background:linear-gradient(135deg,#1a237e,#3949ab)}.cmini.s5{background:linear-gradient(135deg,#bf360c,#ff7043)}
.cmini i{font-style:normal;opacity:.85}.cmini b{font-size:10px;align-self:flex-end}
.cm-plus{width:46px;height:30px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:18px;color:var(--muted);flex:none}
.cards-list{display:flex;flex-direction:column;gap:8px}

.ben-r .bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* легенда и рамки (временно) */
.frames [data-f]{outline:3px solid var(--fc);outline-offset:2px;position:relative}
.frames [data-f]::after{content:attr(data-f);position:absolute;top:-12px;left:-8px;z-index:7;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--fc);color:#000;font:700 12px/22px var(--f-body);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.frames .qrtab[data-f]::after{top:-30px;left:50%;margin-left:-11px}
.frames .artwrap[data-f]{position:absolute}
.frames .catbar[data-f]{position:sticky}
.frames :is(.offer,.bank,.bday,.plusb,.perk,.artwrap,.pd,.catbar)[data-f]::after{top:6px;left:6px}
.blink{animation:blink .6s ease-in-out 4}
@keyframes blink{50%{outline-width:8px;outline-offset:6px}}

.dt.on .dv-gold{color:#b08400;text-shadow:none}.dt.on .dt-when{color:var(--ink);background:var(--bg)}
.dt.off{background:var(--prem);color:#f9f9f9;border-color:transparent}.dt.off .label,.dt.off .ds{color:#f9f9f9;opacity:.85}
.dt.on{border:2px solid var(--blue)}
.dt .pstat{font-size:13px;font-weight:700}.dt.on .pstat{color:#3fae79}
.dt .pbtn{margin-top:6px;padding:8px 14px;border-radius:999px;background:#f9f9f9;color:var(--blue);font-weight:700;font-size:14px}.dt.on .pbtn{background:var(--blue);color:#f9f9f9}
.plus-on{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:12px;background:linear-gradient(135deg,#2b2b93,#5e35b1);color:#f9f9f9;font-size:12px;font-weight:700;line-height:1.15;max-width:58%;box-shadow:0 3px 10px rgba(43,43,147,.35)}
.plus-on svg{width:18px;height:18px;flex:none;fill:#f2c230}
.dt.gift{background:linear-gradient(135deg,#fef2e9,#f6e1b8);color:#212221;border:0}.dt.gift .dv{color:#0d553f}.dt.gift .ds,.dt.gift .label{color:#5a4a2a}
.turbo-intro{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#ff6d00,#d500f9);color:#fff}
.turbo-intro .label{color:#fff;opacity:.9}.turbo-intro b{font-size:20px;line-height:1.2}.turbo-intro .small{opacity:.92;line-height:1.35}
.turbo-intro{flex-direction:row;align-items:center;gap:4px;padding:14px 8px 0 16px;overflow:hidden}
.ti-tx{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;padding-bottom:14px}
.turbo-intro{position:relative}
.ti-x{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.ti-x svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none}
/* Свёрнутая шапка «Турбо» — после закрытия плашки; тап разворачивает её снова */
.turbo-head{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.turbo-head .th-ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#ff6d00,#d500f9)}
.turbo-head .th-ic svg{width:22px;height:22px;stroke:#fff;stroke-width:1.8;fill:none}
.turbo-head .th-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.turbo-head b{font-size:22px;line-height:1.15}
.wowman{width:140px;height:150px;margin-right:-6px;flex:none;align-self:flex-end;overflow:visible}
@media (prefers-reduced-motion:no-preference){
 .wowman .man{transform-origin:84px 132px;animation:wmjump 1.1s ease-in-out infinite}
 .wowman .arm.l{transform-origin:70px 92px;animation:wmarml .55s ease-in-out infinite alternate}
 .wowman .arm.r{transform-origin:98px 92px;animation:wmarmr .55s ease-in-out infinite alternate}
 .wowman .bubble{transform-origin:24px 40px;animation:wmbub 1.1s ease-in-out infinite}
 .wowman .mouth{transform-origin:84px 79px;animation:wmmouth 1.1s ease-in-out infinite}
 .wowman .spark{animation:wmspark 1.4s ease-in-out infinite}
}
@keyframes wmjump{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes wmarml{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes wmarmr{from{transform:rotate(8deg)}to{transform:rotate(-10deg)}}
@keyframes wmbub{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
@keyframes wmmouth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@keyframes wmspark{0%,100%{opacity:.3}50%{opacity:1}}
/* «Моя цель» — одной строкой */
.rhythm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.rhythm.hot{border-color:#ff6d00;box-shadow:0 0 0 3px rgba(255,109,0,.18)}
.rhythm.win{border-color:#f2c230;background:linear-gradient(135deg,rgba(242,194,48,.18),var(--surface) 60%)}
.rh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* «Турбо»: пронумерованные заголовки блоков — градиентный номер «01» (цвет Турбо) + название над карточкой */
.tsec{display:flex;flex-direction:column;gap:10px}
.tsec-h{display:flex;align-items:center;gap:10px}
.tsec-h .num{flex:none;font-family:var(--f-num);font-size:22px;line-height:1;background:linear-gradient(135deg,#ff6d00,#d500f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tsec-h h2{flex:1;margin:0;font-size:22px;line-height:1.15}
.tsec-h .aside{flex:none;font-size:14px;color:var(--muted)}
.streak-line{display:flex;align-items:center;gap:8px;font-weight:600}
.rhythm.warn{border-color:#ff9100}
.rhythm.ok{border-color:#7fc8a0}
.rh-now{display:flex;align-items:stretch;gap:8px}
.rh-f{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 12px;border-radius:14px;background:var(--line)}
.rh-f.pct{background:linear-gradient(135deg,#ff6d00,#d500f9);color:#fff}
.rh-k{font-size:12px;line-height:1.2;opacity:.75}
.rh-v{font-size:15px;line-height:1.1}
.rh-v b{font-family:var(--f-num);font-size:34px;line-height:1;font-weight:400}
.rh-eq{align-self:center;font-family:var(--f-num);font-size:26px;color:var(--muted)}
.ser{display:flex;flex-direction:column;gap:10px}
.ser-pin{flex-direction:row}
.ser-body{margin-top:-10px}
/* полоса серии закреплена под демо-полосой, как верхняя панель Дуолинго */
.ser-pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--demo-h));z-index:12;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.ser-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* число с огнём в строку, подпись — под ними, по левому краю огня */
.ser-main{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:none}
.ser-num{display:flex;align-items:center;gap:6px}
.ser-fl{width:34px;height:44px;flex:none}
.ser-fl path{fill:#ff6d00}
.ser-main b{display:block;font-family:var(--f-num);font-weight:400;font-size:40px;line-height:1}
.ser-main small{font-size:13px;line-height:1.2;margin-top:4px;color:var(--muted);white-space:nowrap}
/* намёк «сюда можно нажать»: стрелка мягко зовёт вправо, по числу раз в несколько секунд пробегает блик, при нажатии — лёгкое «вдавливание» */
.ser-main{position:relative;border-radius:14px;transition:transform .15s}
.ser-main:active{transform:scale(.97)}
.ser-main b{position:relative;background:linear-gradient(100deg,var(--ink) 40%,#ff9d5c 50%,var(--ink) 60%) 100% 0/250% 100% no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}
.ser-main .go{display:inline-block;margin-left:2px;color:#ff6d00;font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .ser-main .go{animation:sergo 1.8s ease-in-out infinite}
  .ser-main b{animation:sershine 5s ease-in-out infinite}
}
@keyframes sergo{0%,60%,100%{transform:none}30%{transform:translateX(4px)}}
@keyframes sershine{0%,70%{background-position:100% 0}90%,100%{background-position:0 0}}
/* Карта всех посещений: месяцы, 🔥 — был, ❄️ — заморозка, 💔 — счётчик сгорел */
.vm-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vm-sum div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:14px;background:var(--line)}
.vm-sum b{font-family:var(--f-num);font-weight:400;font-size:22px;line-height:1}
.vm-sum span{font-size:12px;color:var(--muted);line-height:1.2}
.vm-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.vm-mon{display:flex;flex-direction:column;gap:6px}
.vm-mon h3{margin:6px 0 0;font-size:17px}
.vm-mon h3 small{font-weight:400;color:var(--muted);font-size:13px}
.vm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.vm-grid .h{font-size:11px;color:var(--muted);text-align:center}
.vm-grid .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--muted);background:transparent}
.vm-grid .d.v{background:#ff8a3d;color:#fff;font-weight:700}
.vm-grid .d.fz{background:rgba(155,217,217,.45);color:var(--ink)}
.vm-grid .d.burn{background:rgba(229,57,53,.16);color:#e53935;font-weight:700}
.vm-grid .d.today{box-shadow:0 0 0 2px var(--ink)}
.vm-grid .d.reg{box-shadow:0 0 0 2px #2b2b93}
.vm-grid .d.fut{opacity:.35}
.ser-side{display:flex;gap:6px;min-width:0;margin:0 auto}
.ser-side button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;background:var(--line);width:58px}
.ser-side b{font-size:14px;white-space:nowrap}
.ser-side small{font-size:11px;color:var(--muted)}
.ser-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ser-week span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.ser-week i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:15px}
.ser-week .v i{background:rgba(255,109,0,.18)}
.ser-week .now i{box-shadow:0 0 0 2px var(--ink)}
.ser-week button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:0;background:none}
.stc .ser-week button{color:inherit;opacity:.8}
.ser-week button.can i{box-shadow:0 0 0 2px rgba(41,182,246,.7)}
.fz-hint{margin:0;font-size:12px;opacity:.85}
.restore{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;text-align:left;background:rgba(41,182,246,.18);border:1px solid rgba(41,182,246,.6);color:inherit}
.restore>span:first-child{font-size:24px}
.restore .tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.restore b{font-size:14px}.restore small{font-size:12px;opacity:.8}
.restore .go{font-weight:700;font-size:13px;white-space:nowrap}
.vac{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:rgba(41,182,246,.14);overflow:hidden}
.vac b{font-family:var(--f-num);font-weight:400;font-size:40px;line-height:1;color:#29b6f6}
.vac span{font-size:13px;color:var(--muted)}
.vac i{position:absolute;left:0;bottom:0;height:4px;background:#29b6f6}
.ser-week .x i{background:rgba(229,57,53,.14);color:#e53935;font-weight:900;font-size:17px}
.ser-week .fz i{background:rgba(155,217,217,.35)}
.ser-week .today{color:var(--ink);font-weight:700}
.dash-pin{justify-content:space-between;align-items:center}
.dp-side{display:flex;flex-direction:column;align-items:center;gap:1px;width:76px}
.dp-side b{font-size:17px;white-space:nowrap}
.dp-side small{font-size:12px;color:var(--muted);line-height:1.15;text-align:center;white-space:nowrap}   /* «мой рекорд / подряд», «место / среди гостей» — на тестах «лучший» и «место» без пояснения были непонятны (24.10) */
/* Карточка статуса: Серебряный / Золотой / Платиновый — свой цвет у каждого */
.stc{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;color:#2b1d0e;box-shadow:0 10px 30px -12px var(--glow,rgba(0,0,0,.4))}
.stc-top{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;cursor:pointer}
.stc-chip{align-self:flex-start;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.35)}
.stc-name{font-size:30px;line-height:1.05}
.stc-prog{display:flex;justify-content:space-between;font-size:14px;opacity:.85;padding-right:118px}
.stc-bar{height:6px;border-radius:3px;background:rgba(0,0,0,.15);margin-right:118px}
.stc-bar i{display:block;height:100%;border-radius:3px;background:currentColor}
.stc-btn{position:absolute;right:16px;bottom:14px;padding:8px 14px;border-radius:999px;background:#2b1d0e;color:#fff;font-weight:700;font-size:14px}
.stc-band{display:flex;flex-direction:column;gap:8px;padding:12px 16px 14px;background:rgba(255,255,255,.28)}
.stc-bh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.stc-bh button{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.45);color:inherit}
.stc .ser-week i{background:rgba(255,255,255,.45)}
.stc .ser-week .v i{background:rgba(255,255,255,.85)}
.ser-week .pre{opacity:.3}.ser-week .gap i{opacity:.5}
.stc .ser-week .x i{background:rgba(229,57,53,.18)}
.stc .ser-week span{color:inherit;opacity:.8}
.stc .ser-week .today{opacity:1}
.stc .ser-week .now i{box-shadow:0 0 0 2px currentColor}
.stc .ser-msg{color:inherit}
.t-silver{background:linear-gradient(135deg,#f1f3f6,#c3c9d1 55%,#9aa3ad);--glow:rgba(154,163,173,.6);color:#1f252b}
.t-silver .stc-btn{background:#1f252b}
.t-gold{background:linear-gradient(135deg,#fbe3a1,#e9b955 55%,#c48a2c);--glow:rgba(233,185,85,.6);color:#3a2408}
.t-gold .stc-btn{background:#3a2408}
.t-plat{background:linear-gradient(135deg,#585d7a,#2e3147 55%,#1d1f2e);--glow:rgba(140,150,220,.55);color:#eef0ff}
.t-plat .stc-chip,.t-plat .stc-bh button{background:rgba(255,255,255,.16)}
.t-plat .stc-band{background:rgba(255,255,255,.08)}
.t-plat .stc-btn{background:#eef0ff;color:#1d1f2e}
.t-plat .stc-bar{background:rgba(255,255,255,.2)}
.t-plat .ser-week i{background:rgba(255,255,255,.14)}
.t-plat .ser-week .v i{background:rgba(255,255,255,.3)}
.stc.mini{box-shadow:none}.stc.mini .stc-top{cursor:default}.stc.mini .stc-prog{padding-right:0}
.ladder{display:flex;align-items:flex-start;margin:2px 0}
.ld{display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;flex:none;text-align:center}
.ld b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;opacity:.45;font-size:15px}
.ld small{font-size:12px;line-height:1.15;opacity:.7}
.ld.ok b{opacity:1;background:#2e9e5b;border-color:#2e9e5b;color:#fff}.ld.ok small{opacity:1;font-weight:700}
.ld.next b{opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.45)}.ld.next small{opacity:1}
.ld-line{flex:1;height:2px;margin-top:15px;background:currentColor;opacity:.25;border-radius:1px}.ld-line.ok{background:#2e9e5b;opacity:1}
.stc-perk{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.5);margin-right:118px}
.t-plat .stc-perk{background:rgba(255,255,255,.16)}
.stc.mini .stc-perk{margin-right:0}.stc-perk.big{font-weight:400;border-radius:10px;padding:5px 10px}
/* Подарки за посещения: живут 3 дня, таймер «ещё N дня» / «сгорит сегодня» */
.gifts{display:flex;flex-direction:column;gap:8px}
.gift-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);margin-top:8px}
.gifts .gift-row{margin-top:0}
.gift-row .gi{font-size:26px;line-height:1}
.gift-row .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gift-row .tx small{color:var(--muted);font-size:13px}
.gift-row .gw{font-size:13px;font-weight:700;white-space:nowrap;color:#b26a00}
.gift-row.hot{border-color:#e53935}.gift-row.hot .gw{color:#e53935}
/* Сундук — бирюзовый (фирменный #00657f), чтобы не сливаться ни с одним статусом: серебро — серое, золото — жёлтое, платина — тёмно-синяя */
.gift-row.chest{background:linear-gradient(135deg,#00657f,#1aa39a);border:none;color:#fff;cursor:pointer;box-shadow:0 8px 22px -10px rgba(0,101,127,.8)}
.gift-row.chest .tx small{color:rgba(255,255,255,.85)}
.gift-row.chest .go{background:#fff;color:#00657f;padding:7px 12px;border-radius:999px;font-size:14px}.gift-row .go{font-weight:700;white-space:nowrap}
.mile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.mile h2{margin:4px 0 0}.mile p{margin:4px 0}.mile .gift-row{text-align:left}
.mile-n{font-size:54px;line-height:1;display:flex;align-items:center;gap:8px}.mile-n b{font-size:64px}
/* Акции — отдельный раздел: ряд значков-ссылок, ниже карточки акций */
.promo-h{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.promo-h h2{margin:0;font-size:26px}
.tstack{--page:var(--bg);display:flex;flex-direction:column}
.tk{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--tkbg)}
.tk+.tk{margin-top:8px;padding-top:40px}   /* margin = TK_GAP */
.tk-bulge{position:absolute;left:50%;bottom:-26px;width:300px;height:26px;margin-left:-150px;fill:var(--tkbg);z-index:3;overflow:visible}
.tk-notch{position:absolute;left:50%;top:0;width:300px;height:26px;margin-left:-150px;fill:var(--page);stroke:var(--page);z-index:1}
.tk:last-child .tk-bulge,.tk:first-child .tk-notch{display:none}
.tk-h{display:flex;align-items:baseline;gap:10px}
.tk-h .num{flex:none;font-family:var(--f-num);font-size:22px;line-height:1;color:var(--ink)}
.tk-h h2{margin:0;font-size:20px;line-height:1.15}
.tk>.rhythm,.tk>.panel{background:transparent;border:0;padding:0;box-shadow:none}
.tk .rhythm{padding-bottom:10px}
.tk-mint{--tkbg:#a7d2b9;--ink:#172f28;--muted:#3f5d50;--line:rgba(23,47,40,.12);--surface:rgba(255,255,255,.35);color:var(--ink)}
.rh-left{margin:-4px 0 0;font-size:14px;color:var(--muted)}.rh-left b{color:var(--ink)}   /* вместо загадочного «осталось 1 день» (владелец 24.10) */
.tk-mint .rh-prize{background:rgba(255,255,255,.4)}
.tk-mint .rh-prize .pv{color:#8a6400}
.tk-pink{--tkbg:#ecccce;--ink:#382d2b;--muted:#6e5552;--line:rgba(56,45,43,.16);--surface:rgba(255,255,255,.45);color:var(--ink)}   /* «Каждый 6-й» — нежно-розовая (фирменный #ecccce): серая на тестах выглядела неактивной (владелец 24.10) */
.tk-pink .panel{padding-top:6px;background:transparent;border:0;box-shadow:none}
/* блюда внутри розовой карточки — белые плашки с цветной полосой слева и тенью; пустые отметки заметнее (владелец 24.10: «тусклые») */
.tk-pink .stamp{background:#fff;border:0;border-left:6px solid var(--acc);box-shadow:0 6px 18px rgba(56,45,43,.14);color:#212221;--ink:#212221;--muted:#5d5f5c}
.tk-pink .stamp .sic.e{opacity:.38}
.tk-pink .stamp .sl:not(.six){background:color-mix(in srgb,var(--acc) 7%,#fff)}
.tk-pink .stamp.empty{background:rgba(255,255,255,.55);border:2px dashed rgba(56,45,43,.35);border-left:2px dashed rgba(56,45,43,.35);box-shadow:none}
.tk-pink .stamp.empty .six-plus{background:#fff;color:#c2185b;box-shadow:0 2px 8px rgba(56,45,43,.15)}
.inv-pop{position:relative;display:flex;align-items:center;gap:10px;padding:12px 40px 12px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.inv-pop .pi{font-size:30px;flex:none}
.inv-pop .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.inv-pop small{color:var(--muted);font-size:12px;line-height:1.25}
.inv-pop .btn{flex:none;padding:8px 12px;font-size:13px}
