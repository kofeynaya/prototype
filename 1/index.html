.sr-ic{width:52px;height:52px;border-radius:14px;background:var(--prem,#2b2b93);color:#f2c230;display:grid;place-items:center;font-size:24px;flex:none;font-weight:800}
.sr-row .chev{font-size:22px;color:var(--muted)}
.sr-hit{font-weight:800;background:linear-gradient(transparent 60%,rgba(242,194,48,.55) 60%)}
.sr-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 0 6px}.sr-big{font-size:44px}.sr-empty b{font-size:18px}
/* Подарки */
.gift{display:flex;flex-direction:column;gap:12px}
.gf-steps{display:flex;gap:4px;justify-content:space-between;padding-right:54px;min-height:30px;align-items:center;font-size:12px;color:var(--muted)}
.gf-steps span{display:flex;align-items:center;gap:4px}.gf-steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:12px;font-weight:700}
.gf-steps .on{color:var(--ink);font-weight:700}.gf-steps .on i{background:var(--ink);color:var(--bg);border-color:var(--ink)}.gf-steps .done i{background:#2e9e5b;color:#fff;border-color:#2e9e5b}
.gf-ph{gap:8px}.gf-ph input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.gf-people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gf-people button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink)}
.gf-av{width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:20px;flex:none}.gf-av.big{width:52px;height:52px;font-size:24px}
.gf-to{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.gf-to .tx{flex:1;display:flex;flex-direction:column;min-width:0}.gf-to small{color:var(--muted);font-size:12px}
.gf-kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gf-kind{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.gf-kind .big{font-size:36px}.gf-kind b{font-size:18px}.gf-kind small{font-size:12.5px;color:var(--muted);line-height:1.25}
.gf-kind.on{border-color:#2e9e5b;background:rgba(46,158,91,.1)}.gf-kind.off{opacity:.55}
.gf-amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gf-amts button{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.gf-amts b{font-size:24px;font-family:var(--f-num)}.gf-amts small{font-size:12px;color:var(--muted)}.gf-amts .on{border-color:#2e9e5b;background:rgba(46,158,91,.1)}
.gf-dishes{display:flex;flex-direction:column;max-height:52vh;overflow:auto}
.gf-item{display:flex;align-items:center;gap:12px}.gf-item .tx{flex:1;display:flex;flex-direction:column;min-width:0}.gf-item small{color:var(--muted)}
.gf-check{gap:10px}.gf-check .row{align-items:flex-start;gap:12px}.gf-check b{text-align:right}
.gf-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 16px;border-radius:22px;color:#f9f9f9;background:linear-gradient(140deg,#d6264f,#ff6d00);box-shadow:0 10px 24px rgba(214,38,79,.3)}
.gf-card b{font-size:18px;line-height:1.2}.gf-card span{font-size:14px;opacity:.92}
.gf-msgs{display:flex;flex-wrap:wrap;gap:8px}
.gf-ta{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:none;width:100%}
.gf-note{font-style:italic;font-size:15px!important;opacity:1!important;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.18);max-width:100%;overflow-wrap:anywhere}
.gf-bow{font-size:40px}.gf-bow.big{font-size:72px}
.gf-done{align-items:center;text-align:center;padding-top:10px}.gf-done .btn{width:100%}
.gf-link{padding:10px 14px;border-radius:12px;background:var(--line);font-size:15px}
.gf-go{background:linear-gradient(140deg,#d6264f,#ff6d00);color:#fff;border:0}
.gf-share{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(214,38,79,.14),rgba(255,109,0,.08));border:1px solid rgba(214,38,79,.35)}
.gf-share>b{font-size:18px}.gf-share>span{font-size:14px;color:var(--muted)}
.gf-h{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.gf-h .tx{flex:1;display:flex;flex-direction:column;min-width:0}.gf-h small{font-size:12.5px;color:var(--muted)}
.bon-big{display:flex;align-items:center;gap:12px;font-size:20px}.bon-big .coin{width:44px;height:44px}.bon-big b{font-size:34px;font-family:var(--f-num)}
.lb-gift{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:rgba(214,38,79,.1)}
span.lb-gift{background:none}
/* 24.10: подарок в рейтинге — не голая иконка, а кнопка со словом; посещения — под именем */
.lb-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lb-who .st{font-size:13px;font-weight:600;color:var(--muted)}
.lb-who .nm{white-space:normal;overflow:visible;line-height:1.15}
.lb-give{flex:none;display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;background:#ecccce;color:#212221;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(214,38,79,.25)}
.lb-give:active{transform:scale(.96)}
.lb-give{padding:7px 12px 7px 9px;gap:6px;border-radius:16px;text-align:left}.lb-give .gi{font-size:20px;line-height:1}.lb-give .gt{font-size:13px;line-height:1.1}
.lbr .st::before{display:none}
.lbr{cursor:pointer}

/* Подключение подписки: яркая кнопка и окно с картой */
.plus-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border:0;border-radius:999px;color:#212221;font-weight:800;font-size:18px;line-height:1.1;background:linear-gradient(100deg,#f2c230,#ffb300 45%,#ff8a65);background-size:200% 100%;box-shadow:0 8px 24px rgba(242,178,48,.45),inset 0 1px 0 rgba(255,255,255,.6);animation:ctaShine 4s ease-in-out infinite}
.plus-cta>span{display:flex;flex-direction:column;align-items:flex-start;text-align:left}.plus-cta small{font-size:13px;font-weight:600;opacity:.8}
.plus-cta .star-y{width:24px;height:24px;flex:none;fill:#2b2b93}.plus-cta .star-y path{fill:#2b2b93}
.plus-cta:active{transform:scale(.98)}.plus-cta.wait{opacity:.85}
@keyframes ctaShine{0%,100%{background-position:0 0}50%{background-position:100% 0}}
@media (prefers-reduced-motion: reduce){.plus-cta{animation:none}}
.cp{display:flex;flex-direction:column;gap:12px}.cp h2{display:flex;align-items:center;gap:8px}.cp h2 .star-y{width:24px;height:24px}
.cp-sum{gap:8px}
/* Пополнение: проверка → банк (код из СМС) → чек */
.tp{display:flex;flex-direction:column;gap:12px}
.tp-sum{gap:8px}.tp-g{color:var(--ok)}.tp-tot{border-top:1px solid var(--line);padding-top:8px}
.tp-eq{align-self:flex-end;padding:3px 10px;border-radius:999px;background:rgba(46,158,91,.14);color:var(--ok);font-size:13px;font-weight:600}
.tp-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.tp-opt svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.tp-opt span{display:flex;flex-direction:column}.tp-opt small{color:var(--muted);font-size:13px}
.tp-opt.on{border-color:#2e9e5b;box-shadow:0 0 0 2px rgba(46,158,91,.35) inset}
.tp-go{width:100%;justify-content:center;display:flex;align-items:center;gap:10px}.tp-go:disabled{opacity:.5}
.bank3ds{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:#fff;color:#1b1b1f;text-align:center}
.bank-h{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;padding-bottom:12px;border-bottom:1px solid #e6e6ea}
.bank-h small{font-weight:400;color:#6b6b75}
.bank-logo{width:36px;height:36px;border-radius:10px;background:#1e5eff;display:grid;place-items:center}
.bank-logo svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8}
.bank-sum{display:flex;flex-direction:column;gap:2px}.bank-sum b{font-size:28px}.bank-sum small,.bank-sum span{color:#6b6b75;font-size:14px}
.bank3ds p{margin:0;color:#3a3a42;font-size:15px}
.bank-in{font:inherit;font-size:28px;letter-spacing:12px;text-align:center;padding:12px;border-radius:12px;border:1.5px solid #d0d0d8;background:#f5f5f7;color:#1b1b1f;width:100%}
.bank-in:focus{outline:none;border-color:#1e5eff}
.bank-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:12px;background:#1e5eff;color:#fff;font-weight:700;font-size:16px;width:100%}
.bank-btn:disabled{opacity:.45}.bank-btn .cp-spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.bank-re{font-size:13px;color:#6b6b75}.bank-re .link{color:#1e5eff}
.tp-res{align-items:center;text-align:center}
.tp-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:700;color:#fff;animation:tpPop .45s cubic-bezier(.2,1.4,.4,1)}
.tp-ic.ok{background:#2e9e5b;box-shadow:0 0 30px rgba(46,158,91,.55)}.tp-ic.bad{background:#e53935;box-shadow:0 0 30px rgba(229,57,53,.5)}
@keyframes tpPop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.tp-big{font-family:var(--f-num);font-size:40px;line-height:1}
.tp-cb{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-radius:14px;background:rgba(46,158,91,.14);color:var(--ok)}
.tp-res .tp-sum{width:100%;text-align:left}
.cp-card{display:flex;flex-direction:column;justify-content:space-between;gap:16px;aspect-ratio:1.6;max-height:190px;padding:18px 20px;border-radius:18px;color:#f9f9f9;background:linear-gradient(135deg,#2b2b93,#5e35b1 55%,#00657f);box-shadow:0 10px 28px rgba(43,43,147,.4)}
.cp-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f2c230,#c9971c)}
.cp-num{font-size:21px;letter-spacing:1px}.cp-row{display:flex;justify-content:space-between;font-size:13px;opacity:.85;letter-spacing:.5px}
.cp-in{font:inherit;font-size:19px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.cp-in:focus{outline:none;border-color:#5e35b1}
.cp-spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(33,34,33,.25);border-top-color:#212221;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* «Заряд выгоды»: две группы вместо галочек-кружков (24.10) */
.pw-g{display:flex;flex-direction:column;gap:10px}
.pw-g h2{display:flex;align-items:center;gap:8px}
.pw-n{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#e53935;color:#fff;font-size:15px;display:inline-grid;place-items:center;font-family:var(--f-num)}
.pw-n.ok{background:#2e9e5b;color:#fff}
.pw-off{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid rgba(255,145,0,.45);text-align:left;color:var(--ink)}
.pw-off .pi,.pw-on .pi{font-size:26px;flex:none}
.pw-off .tx,.pw-on .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pw-off .tx b{font-size:16px}
.pw-off small,.pw-on small{color:var(--muted);font-size:13px;line-height:1.25}
.pw-act{align-self:flex-start;margin-top:8px;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;white-space:nowrap}
.pw-tip .pw-act{background:#fff;color:#212221}
.pw-off:active,.pw-tip:active{transform:scale(.98)}
.pw-on{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.pw-on:last-child{border-bottom:0}
.pw-on .tx b{font-size:15px}
.pw-ok{flex:none;font-size:13px;font-weight:700;color:#2e9e5b;display:flex;align-items:center;gap:5px}
.pw-ok::before{content:"";width:8px;height:8px;border-radius:50%;background:#2e9e5b;box-shadow:0 0 0 3px rgba(46,158,91,.2)}

/* Сообщение «Кофейная+ подключена» — тем же жёлтым, что и кнопка подписки (владелец 24.10) */
.toast.gold{display:flex;align-items:center;gap:12px;color:#212221;background:linear-gradient(100deg,#f2c230,#ffb300 45%,#ff8a65);border:0;box-shadow:0 10px 28px rgba(242,178,48,.5)}
.toast.gold .star-y{width:28px;height:28px;flex:none}.toast.gold .star-y,.toast.gold .star-y path{fill:#2b2b93}

.pw-list{padding-top:14px}
.pw-h{display:flex;align-items:center;gap:8px;font-size:18px;margin:6px 0 2px}.pw-h:not(:first-child){margin-top:18px}
.pw-on.off{align-items:flex-start}.pw-on.off .pi{margin-top:2px}
.pw-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}.pw-foot .pw-act{margin-top:0}
.pw-ok.no{color:#ff5252}.pw-ok.no::before{background:#e53935;box-shadow:0 0 0 3px rgba(229,57,53,.25)}   /* красный — как батарейка при низком заряде (владелец 24.10) */
.pw-on .pw-act{padding:8px 13px;font-size:13.5px;margin-top:8px}
.pw-l-off{border-color:rgba(229,57,53,.45);background:linear-gradient(180deg,rgba(229,57,53,.08),transparent 120px),var(--surface)}
.pw-l-on{border-color:rgba(46,158,91,.45);background:linear-gradient(180deg,rgba(46,158,91,.1),transparent 120px),var(--surface)}

/* «🏆 Твой рейтинг» в профиле — отдельная заметная строка (владелец 24.10) */
.rate-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;text-align:left;color:#212221;background:linear-gradient(110deg,#f2c230,#ffd95e 55%,#ffb300);box-shadow:0 8px 22px rgba(242,178,48,.35)}
.rate-row .rr-ic{font-size:30px;flex:none}.rate-row .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.rate-row b{font-size:18px}.rate-row small{font-size:13.5px;opacity:.8}
.rate-row .chev{font-size:26px;font-weight:700}

/* «Каждый 6-й»: правило картинкой (владелец 24.10) */
.six-how{display:flex;flex-direction:column;gap:10px}
.six-how .six-rule{font-size:16px;font-weight:600}
.sx-path{display:flex;align-items:center;gap:5px}
.sx-path i{width:24px;height:24px;flex:none;border-radius:50%;background:#382d2b;color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.sx-ar{font-size:20px;font-weight:700;margin:0 2px}
.sx-6{padding:5px 11px;border-radius:999px;background:#c2185b;color:#fff;font-size:14.5px;white-space:nowrap}
.sx-offs{display:flex;flex-wrap:wrap;gap:6px}
.sx-off{display:inline-flex;align-items:baseline;gap:5px;padding:7px 10px;border-radius:14px;font-size:14px;font-weight:600;white-space:nowrap}
.sx-off b{font-family:var(--f-num);font-weight:400;font-size:16px;line-height:1}
@media (max-width:360px){.sx-path i{width:20px;height:20px;font-size:11px}.sx-path{gap:4px}.sx-off{font-size:13px;padding:6px 8px}.sx-off b{font-size:14px}}
.six-how .sx-note{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
.sx-off.new{background:#2e9e5b;color:#fff}
.sx-off.old{background:#00657f;color:#fff}

/* Смахнуть блюдо влево — «Убрать» (владелец 24.10) */
.sw-wrap{position:relative;border-radius:16px;overflow:hidden}
.sw-acts{position:absolute;inset:0;display:flex;justify-content:flex-end;border-radius:16px;overflow:hidden}
.sw-chg,.sw-del{flex:none;width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;font-size:15px}
.sw-chg{background:#f08a2c}.sw-del{background:#e53935}
.sw-acts>:first-child{width:134px;padding-left:24px}   /* первая кнопка заходит под скруглённый край плашки — без щели */
.sw-chg svg,.sw-del svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw-wrap>.stamp{position:relative;z-index:1;touch-action:pan-y;transition:transform .25s ease;background:linear-gradient(var(--tint),var(--tint)),var(--bg);user-select:none;-webkit-user-select:none}
.tk-pink .sw-wrap{box-shadow:0 6px 18px rgba(56,45,43,.14)}.tk-pink .sw-wrap>.stamp{background:#fff;box-shadow:none}
.sw-tip{margin:2px 0 0;font-size:12.5px;color:var(--muted);text-align:center}

/* окно «Чем заменить?» */
.sp-cur{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sp-cur .sic{width:34px;height:34px}.sp-cur .tx{display:flex;flex-direction:column}.sp-cur small{color:var(--muted)}
.sp-warn{margin:0;color:#ff5252;font-weight:600;font-size:14px}
.sp-red{border-color:#e53935!important;color:#ff5252!important}

/* ===== Эксперимент /1/: верхняя полоса, сторис, 3 вкладки с большой «Турбо» ===== */
:root{--gbar-h:50px}
.gbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--demo-h));z-index:19;height:var(--gbar-h);display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.app.glass .gbar{background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--glass-line)}
.catbar,.ser-pin{top:calc(env(safe-area-inset-top,0px) + var(--demo-h) + var(--gbar-h))!important}
.gb-bat{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gb-bat b{font-size:14px;color:var(--lv)}
.ibat{position:relative;width:28px;height:14px;border:2px solid var(--ink);border-radius:4px;padding:1px;display:block}
.ibat::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;border-radius:0 2px 2px 0;background:var(--ink)}
.ibat i{display:block;height:100%;border-radius:2px;background:var(--lv)}
/* 25.10 (владелец, повторно): зелёный — только на 100%; 75–99% — оранжево-зелёный градиент, ни одного чисто зелёного элемента */
.gb-bat.lv-almost .ibat i{background:linear-gradient(90deg,#ff9100,#2e9e5b)}
.gb-bell{position:relative}.gb-bell .n{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#e53935;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.gb-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.gb-ic svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2}
.gb-qr{background:var(--ink)}.gb-qr svg{stroke:var(--bg)}
.stories{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}

/* ===================== Кофейни и доставка (данные сайта) ===================== */
const SHOPS = [

];

// Зоны доставки Кофейной 5 (с сайта): центр — мин. 700 ₽, 150 ₽ до 1 500 ₽, 70–90 мин; дальние — мин. 1 000 ₽, 250 ₽, 135–155 мин

  S.ser.fzm = S.ser.fzm&&S.ser.fzm.m===m?{m,used:S.ser.fzm.used+a}:{m,used:a}; S.ser.vacUsed=(S.ser.vacUsed||0)+n-a; }
// Неделя не набрала 3 — счётчик не сгорает сразу: в понедельник предложение «заморозь N дней», 7 дней на решение
const timesTxt=n=>n?`${n} ${plural(n,'раз','раза','раз')}`:'ни разу';
// «На прошлой неделе ты был 2 раза, а нужно хотя бы 3» — без загадочного «2 из 3»
function pendTxt(){ const p=S.ser.pend; if(!p) return ''; return p.weeks.length>1?`${p.weeks.length} ${plural(p.weeks.length,'неделю','недели','недель')} подряд ты заходил реже ${SER_MIN} раз в неделю`:(serDays(p.weeks[0])?`На прошлой неделе ты был ${timesTxt(serDays(p.weeks[0]))}`:'На прошлой неделе ты не был ни разу')+`, а нужно хотя бы ${SER_MIN}`; }
function pendNeed(){ const p=S.ser.pend; return p?p.weeks.reduce((a,w)=>a+Math.max(0,SER_MIN-serDays(w)),0):0; }
function burnPend(){ const p=S.ser.pend; if(!p) return; S.ser.lost=p.n; S.ser.lostWeek=p.weeks[0]; S.ser.burnt=[...(S.ser.burnt||[]),...p.weeks]; S.ser.n=Math.max(0,S.ser.n-p.n); S.ser.pend=null; }
const lastWeekDays = () => { const w=weekOf(S.day)-1; return w>=0 ? weekDays(w) : ((S.past||[]).slice(-1)[0]||0); };
const rawRate = () => Math.min(7,lastWeekDays());            // % по ритму без учёта подписки
const rateCap = () => S.plus ? PLUS_CAP : FREE_CAP;
const rate = () => Math.min(rawRate(), rateCap());            // % бонусов с каждой покупки на этой неделе
const walletTotal = () => S.wallet.money+S.wallet.gift;

/* ===================== Награды за посещения подряд (решение владельца 21.10) =====================
   Статус даёт % сверху к ритму: Золотой +1%, Платиновый +2% и каждый понедельник «любой напиток −50%».
   Сундук — за неделю с 5+ настоящими посещениями (заморозка не считается). Вехи 30/50/100/200 — праздник и подарок, каждая один раз.
   ГЛАВНОЕ: подарки не копятся — каждый действует 3 дня (день выдачи + 2), потом сгорает. Только с Кофейная+. */
const GIFT_DAYS=3, CHEST_MIN=5, TIER_PLUS={gold:1,plat:2};
const isDrink=m=>['coffee','tea'].includes(LCAT(m)), isSweet=m=>LCAT(m)==='pastry';
const GIFT_KIND={
  // 25.10 (владелец): подарок — ОДНА штука; «Любой десерт −50%» читалось как «все десерты 3 дня» — пишем «Один десерт на выбор»
  drink50:{t:'Один напиток на выбор −50%', ic:'☕', fit:isDrink, off:.5},
  drink30:{t:'Один напиток на выбор −30%', ic:'☕', fit:isDrink, off:.3},
  sweet50:{t:'Один десерт на выбор −50%',  ic:'🧁', fit:isSweet, off:.5},
  drink100:{t:'Один напиток на выбор в подарок', ic:'☕', fit:isDrink, off:1},

};
// Вехи: 30, 50, 100, а дальше каждые 100 — до бесконечности (200, 300, 400…)
const mileAt=n=>n===30?{n,g:['drink30']}:n===50?{n,g:['drink50']}:n===100?{n,g:['drink100']}:n>100&&n%100===0?{n,g:['drink100','sweet100']}:null;
const CHEST_PRIZES=['drink30','sweet50','drink50','sweet50','drink30'];
if(!S.gft) S.gft={sent:[],recent:[]}; // подарки другим людям
if(!S.rw) S.rw={gifts:[],miles:{30:1,50:1},chest:{week:weekOf(S.day)-1,open:false},platWeek:null}; // демо: вехи 30 и 50 уже пройдены, сундук за прошлую неделю ждёт
const tierPlus=()=>S.plus?(TIER_PLUS[tierOf(S.ser.n).k]||0):0;
const rateAll=()=>rate()+tierPlus();                                   // % бонусов с покупки: ритм + статус
const rateWhy=()=>tierPlus()?`${rate()}% за ритм + ${tierPlus()}% ${tierOf(S.ser.n).n}`:`${rate()}% за ритм`;
const giftsLive=()=>S.plus?S.rw.gifts.filter(g=>!g.used&&!g.gone&&S.day>=g.from&&S.day<=g.until):[];
const giftLeft=g=>g.until-S.day+1;                                     // сколько дней осталось, включая сегодня
const giftWhen=g=>{ const n=giftLeft(g); return n<=1?'сгорит сегодня':`ещё ${n} ${plural(n,'день','дня','дней')}`; };
function giveGift(kind,why){ const g={id:Date.now()+Math.random(),kind,why,from:S.day,until:S.day+GIFT_DAYS-1}; S.rw.gifts.push(g); return g; }
function givePlat(){ const w=weekOf(S.day); if(S.plus&&tierOf(S.ser.n).k==='plat'&&S.rw.platWeek!==w){ S.rw.platWeek=w; giveGift('drink50','Платиновый — подарок недели'); return true; } return false; }
// Веха: 30/50/100/200 подряд — только за настоящее посещение (вызывается из покупки)
function checkMile(){ const m=mileAt(S.ser.n); if(!m||S.rw.miles[m.n]) return null; S.rw.miles[m.n]=1; m.g.forEach(k=>giveGift(k,`${m.n} посещений подряд`)); return m; }
function celebrateMile(m){ confetti(); setTimeout(confetti,700);
  sheet(`<div class="mile"><div class="mile-n">🎉<b class="money">${m.n}</b></div><h2>${m.n} посещений подряд!</h2><p>Ты молодец. Держи подарок:</p>
    ${m.g.map(k=>`<div class="gift-row"><span class="gi">${GIFT_KIND[k].ic}</span><span class="tx"><b>${GIFT_KIND[k].t}</b><small>1 штука — на одну покупку<br>Действует ${GIFT_DAYS} дня — успей</small></span></div>`).join('')}
    <p class="small muted">Скидка посчитается сама — на кассе по QR или в заказе</p><button class="btn block" onclick="closeSheet()">Ура!</button></div>`); }
function openChest(){ if(!S.plus) return premGate('Сундук — только с ★ Кофейная+','Неделя, где 5 и больше посещений, — сундук с призом');
  const c=S.rw.chest; if(!c||c.open) return; c.open=true; const k=CHEST_PRIZES[Math.floor(Math.random()*CHEST_PRIZES.length)]; giveGift(k,'Приз из сундука'); save(); render(); confetti();
  sheet(`<div class="mile"><div class="mile-n">🎁</div><h2>Твой приз</h2><div class="gift-row"><span class="gi">${GIFT_KIND[k].ic}</span><span class="tx"><b>${GIFT_KIND[k].t}</b><small>1 штука — на одну покупку<br>Действует ${GIFT_DAYS} дня — потом сгорит</small></span></div>
    <p class="small muted">Скидка посчитается сама — на кассе по QR или в заказе</p><button class="btn block" onclick="closeSheet()">Забрать</button></div>`); }
const chestReady=()=>S.plus&&S.rw.chest&&!S.rw.chest.open&&S.rw.chest.week===weekOf(S.day)-1;
// Блок «Мои подарки»: сундук + живые подарки с таймером. Пусто — ничего не показываем
function giftsBlock(){
  const gs=giftsLive(), ch=chestReady(); if(!gs.length&&!ch) return '';
  return `<div class="gifts">
    ${ch?`<button class="gift-row chest" onclick="openChest()"><span class="gi">🎁</span><span class="tx"><b>Сундук за прошлую неделю</b><small>5 и больше посещений — держи приз</small></span><span class="go">Открыть ›</span></button>`:''}
    ${gs.map(g=>`<div class="gift-row ${giftLeft(g)<=1?'hot':''}"><span class="gi">${GIFT_KIND[g.kind].ic}</span><span class="tx"><b>${GIFT_KIND[g.kind].t}</b><small>${g.why}<br>1 штука — на одну покупку</small></span><span class="gw">${giftLeft(g)<=1?'🔥 ':'⏳ '}${giftWhen(g)}</span></div>`).join('')}
  </div>`;
}

function bdInfo(){
  const b=S.birth; const today=dateOf(S.day); let best=null;
  if(!b||!b.d) return {set:false,active:false,diff:null,age:0,pct:0,date:null,from:null,to:null,capLeft:0};   // дату ещё не указали
  for(const y of [today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1]){
    const bd=new Date(y,b.m,b.d); const diff=Math.round((bd-today)/864e5);
    if(!best||Math.abs(diff)<Math.abs(best.diff)) best={diff,age:y-b.y,date:bd};
  }
  best.set=true; best.active=Math.abs(best.diff)<=7;
  // дату указывают минимум за 30 дней до дня рождения — иначе скидка начнёт работать со следующего года
  if(b.setDay!=null && Math.round((best.date-dateOf(b.setDay))/864e5)<30) best.active=false, best.tooLate=true; best.pct=S.plus?best.age:BD_FREE;
  best.from=new Date(+best.date-7*864e5); best.to=new Date(+best.date+7*864e5);
  best.capLeft=Math.max(0,BD_CAP-(S.bdUsed[S.day]||0));
  return best;
}

/* ===================== Персонализация ===================== */
function pickWeighted(obj){ const e=Object.entries(obj); let t=e.reduce((a,[,v])=>a+v,0), r=Math.random()*t; for(const [k,v] of e){ if((r-=v)<=0) return k } return e[0][0]; }
const rnd = a => a[Math.floor(Math.random()*a.length)];
function makeOffer(){
  const explore = Math.random()<0.3;
  const cat = explore ? rnd(Object.keys(CAT)) : pickWeighted(S.w.cat);
  const mech = explore ? rnd(Object.keys(MECH)) : pickWeighted(S.w.mech);
  const item = rnd(MENU.filter(m=>LCAT(m)===cat && m.p<=700));
  const o = {day:S.day, cat, mech, item:item.id, status:'shown', explore, opened:false};
  const nm = item.n;
  if(mech==='pct'){ o.pct=rnd([10,15,20]); o.title=`${nm} −${o.pct}%`; o.meta=`Сегодня со скидкой ${o.pct}%<br>Одна порция — на кассе или в заказе`; }
  if(mech==='price'){ o.newPrice=Math.round(item.p*0.8/10)*10; o.title=`${nm} за ${o.newPrice} ₽`; o.meta=`Вместо ${rub(item.p)}<br>Одна порция, только сегодня`; }
  if(mech==='gift'){ o.item=ID.cookie; o.cat='pastry'; o.title='Шоколадное печенье в подарок к кофе'; o.meta='Возьмите любой кофе — печенье добавим бесплатно.'; }
  if(mech==='combo'){ const c=rnd([ID.cap,ID.latte,ID.flat]), p=rnd([ID.croissant,ID.muffin]); o.combo=[c,p]; o.item=c;
    const full=byId(c).p+byId(p).p; o.comboPrice=Math.round(full*0.85/10)*10;
    o.title=`${byId(c).n} + ${byId(p).n.toLowerCase()}`; o.meta=`Вместе за ${rub(o.comboPrice)} вместо ${rub(full)}.`; }
  o.why = explore||!S.orders.length ? 'Пробуем новое: так приложение узнаёт, что вам нравится.' : `Вы часто берёте: ${CAT[o.cat]}. И чаще пользуетесь вариантом «${MECH[mech]}».`;
  o.art = S.day % ARTS.length; o.bg = ARTS[o.art].bg;   // «назначено» ≠ «показано»: показ считаем в home(), когда гость реально увидел карточку
  return o;
}
function makePrices(){
  const cats=Object.entries(S.w.cat).sort((a,b)=>b[1]-a[1]).map(e=>e[0]); const picks=[];
  for(const c of cats){ for(const m of MENU.filter(x=>LCAT(x)===c && x.p<=600 && x.img && x.vars.length===1)){ if(picks.length<3 && Math.random()<0.35 && !picks.includes(m)) picks.push(m) } }
  while(picks.length<3){ const m=rnd(MENU.filter(x=>x.img)); if(!picks.includes(m)) picks.push(m) }
  return picks.map(m=>({item:m.id, price: m.p-Math.max(5,Math.round(m.p*(0.03+Math.random()*0.05)/5)*5)}));
}
function ensureDaily(){
  if(!S.offer || S.offer.day!==S.day) S.offer=makeOffer();
  if(S.pricesWeek!==weekOf(S.day)){ S.prices=makePrices(); S.pricesWeek=weekOf(S.day); }
}
function learn(o, kind){
  const k = kind==='used'?0.5 : kind==='ignored'?-0.08 : kind==='expired'?-0.15 : 0;
  S.w.cat[o.cat]=Math.max(.3,+(S.w.cat[o.cat]+k).toFixed(2));
  S.w.mech[o.mech]=Math.max(.3,+(S.w.mech[o.mech]+k).toFixed(2));
}
const myPrice = id => S.plus ? (S.prices||[]).find(p=>p.item===id)?.price : undefined;
function recommend(n=8){
  const inB=new Set(S.basket.map(l=>l.id));
  return MENU.filter(m=>m.img && !inB.has(m.id)).map(m=>({m, s:S.w.cat[LCAT(m)]*(m.b==='hit'?1.3:1)*(myPrice(m.id)?1.4:1)*(0.6+Math.random()*0.8)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.m);
}

/* ===================== Расчёт выгоды (касса и онлайн — один движок) =====================
   lines: [{id, qty, sur}] — sur = доплата за опции. На строку одна лучшая скидка; комбо — на свои строки. */
function quote(lines, opt={}){
  let regular=0, offerUsed=false, bdDisc=0; const sixthUsed=[];
  const prem=S.plus, o=prem && S.offer && S.offer.status==='activated' ? S.offer : null;   // без Премиум — ни предложения дня, ни 6-го, ни ДР, ни бонусов, ни депозита
  const units=[]; for(const l of lines) for(let i=0;i<l.qty;i++) units.push({id:l.id,sur:l.sur||0});
  const comboLeft = o&&o.mech==='combo' ? [...o.combo] : null;
  let singleLeft = o&&(o.mech==='pct'||o.mech==='price') ? 1 : 0;
  let giftLeft = o&&o.mech==='gift'&&units.some(u=>LCAT(byId(u.id))==='coffee') ? 1 : 0;
  const comboOk = comboLeft && comboLeft.every(c=>units.some(u=>u.id===c));
  const bd=bdInfo(), bdOn=prem&&bd.active&&(S.birth.verified||opt.doc||opt.online); let bdLeft=bdOn?bd.capLeft:0;
  const sixLeft={}; let sixOne=1; if(prem && S.six.usedDay!==S.day) S.six.slots.forEach(sl=>{ if(sl&&sl.n>=5) sixLeft[sl.id]=sixOff(sl) });   // не больше одной скидки «6-го» в день
  const gLeft=giftsLive().map(g=>({...g})), giftsUsed=[];   // подарки за посещения: каждый — на одну позицию
  { const best=Object.keys(sixLeft).filter(id=>units.some(u=>u.id===id)).sort((x,y)=>byId(y).p*sixLeft[y]-byId(x).p*sixLeft[x])[0];   // одна скидка «6-го» в день — самая выгодная для гостя
    for(const id in sixLeft) if(id!==best) delete sixLeft[id]; }
  const out=[];
  for(const u of units){
    const m=byId(u.id), full=m.p+u.sur; regular+=full;
    if(comboOk && comboLeft.includes(u.id)){ comboLeft.splice(comboLeft.indexOf(u.id),1); out.push({id:u.id,name:m.n,regular:full,price:null,why:'комбо дня',k:'offer'}); continue; }
    let best={price:full,why:'',k:''};
    const cand=(p,why,k)=>{ if(p<best.price) best={price:p,why,k} };
    const pp=myPrice(u.id); if(pp!=null) cand(pp+u.sur,'★ цена недели','pp');
    if(singleLeft && u.id===o.item) cand(o.mech==='pct'?Math.round(full*(1-o.pct/100)):o.newPrice+u.sur,'предложение дня','offer');
    if(sixLeft[u.id]&&sixOne) cand(full-Math.round(m.p*sixLeft[u.id]),'6-й −'+Math.round(sixLeft[u.id]*100)+'%','six');   // скидка — от цены стандартной порции
    if(bdLeft>0) cand(full-Math.min(bdLeft,Math.round(full*bd.pct/100)),`день рождения −${bd.pct}%`,'bd');
    if(giftLeft && u.id===ID.cookie) cand(0,'подарок','gift');
    let gPick=null; for(const g of gLeft){ if(g.left===0||!GIFT_KIND[g.kind].fit(m)) continue; const p=Math.round(full*(1-GIFT_KIND[g.kind].off)); if(p<best.price){ cand(p,'🎁 '+GIFT_KIND[g.kind].t.toLowerCase(),'rw'); gPick=g; } }
    if(best.k==='offer'){ singleLeft=0; offerUsed=true; }
    if(best.k==='gift'){ giftLeft=0; offerUsed=true; }
    if(best.k==='six'){ sixLeft[u.id]=0; sixOne=0; sixthUsed.push(u.id); }
    if(best.k==='rw'){ gPick.left=0; giftsUsed.push(gPick.id); }
    if(best.k==='bd'){ bdLeft-=full-best.price; bdDisc+=full-best.price; }
    out.push({id:u.id,name:m.n,regular:full,price:best.price,why:best.why,k:best.k==='gift'?'offer':best.k});
  }
  if(comboOk){ const cl=out.filter(l=>l.price===null); const full=cl.reduce((a,l)=>a+l.regular-0,0);
    cl.forEach(l=>l.price=Math.round(l.regular/full*o.comboPrice)); offerUsed=true; }
  const paid=out.reduce((a,l)=>a+l.price,0);
  const fee=opt.fee||0;
  const bonusSpend = opt.bonus&&prem ? Math.min(S.bonus, Math.floor(paid*BONUS_MAX_SHARE)) : 0;
  const after = paid-bonusSpend+fee;
  const walletSpend = opt.wallet&&prem ? Math.min(walletTotal(), after) : 0;
  return {lines:out, regular, paid, saved:regular-paid, offerUsed, sixthUsed, giftsUsed, bdDisc, bdOn, bdNeedsDoc: bd.active&&!S.birth.verified,
          bonusSpend, walletSpend, fee, card:after-walletSpend, bonus:Math.floor((paid-bonusSpend)*rateAll()/100)};
}
/* Общая «покупка»: засчитывает день, бонусы, отметки 6-го, ДР, обучение. channel: Касса/Доставка/Самовывоз/За столиком */
function applyPurchase(q, channel, doc){
  const src={}; q.lines.forEach(l=>{ if(l.k&&l.regular>l.price) src[l.k]=(src[l.k]||0)+l.regular-l.price; });
  const giftSpend=Math.max(0,q.walletSpend-Math.min(S.wallet.money,q.walletSpend));
  S.orders.push({day:S.day, items:q.lines.map(l=>l.id), sum:q.paid-q.bonusSpend+q.fee, goods:q.paid, saved:q.saved, src, giftSpend, bonus:q.bonus, bonusSpend:q.bonusSpend, walletSpend:q.walletSpend, ch:channel});
  const dayTotal = S.orders.filter(o=>o.day===S.day).reduce((a,o)=>a+(o.goods??o.sum),0);
  const counted = S.visits.includes(S.day), first = !counted && dayTotal>=MIN_DAY;
  let mile=null;
  if(first){ S.visits.push(S.day); if(S.plus){ if(!S.ser.n){ S.ser.start=S.day; if(S.remind==null) S.remindAsk=1; } S.ser.n++; S.ser.best=Math.max(S.ser.best,S.ser.n); mile=checkMile(); if(givePlat()) setTimeout(()=>toast('💎 Ты Платиновый! Держи подарок: один напиток на выбор −50% (1 штука) — 3 дня',4500),mile?6000:3400); } }
  (q.giftsUsed||[]).forEach(id=>{ const g=S.rw.gifts.find(x=>x.id===id); if(g) g.used=S.day; });
  if(mile) setTimeout(()=>celebrateMile(mile),2600);
  S.saved+=q.saved; S.bonus+=q.bonus-q.bonusSpend;
  let w=q.walletSpend; const fm=Math.min(S.wallet.money,w); S.wallet.money-=fm; w-=fm; S.wallet.gift-=w;
  if(q.walletSpend) (S.wallet.ops=S.wallet.ops||[]).push({day:S.day,k:'pay',t:`${channel==='Касса'?SHOPS[S.shop].n+' · касса':channel} · ${q.lines.length} поз.`,sum:-q.walletSpend});
  S.pastryCount+=q.lines.filter(l=>LCAT(byId(l.id))==='pastry').length;
  if(q.offerUsed){ S.offer.status='used'; S.funnel.used++; S.mechTried[S.offer.mech]=1; learn(S.offer,'used'); }
  const bought=new Set(q.lines.map(l=>l.id));
  S.six.slots.forEach((sl,i)=>{ if(!sl||!bought.has(sl.id)||!S.plus) return;
    if(q.sixthUsed.includes(sl.id)){ S.six.usedDay=S.day; S.six.slots[i]=null; }   // круг закрыт — ячейка свободна, можно выбрать новое
    else if(sl.stampDay!==S.day && sl.n<5){ sl.n++; sl.stampDay=S.day; sl.last=S.day; if(sl.n>=5) sl.ready=S.day; } });
  if(q.bdOn){ if(doc) S.birth.verified=true; S.bdUsed[S.day]=(S.bdUsed[S.day]||0)+q.bdDisc; }
  q.lines.forEach(l=>{ const c=LCAT(byId(l.id)); S.w.cat[c]=+(S.w.cat[c]+0.1).toFixed(2) });
  const got=checkAch();
  const wd=weekDays(weekOf(S.day));
  let msg = first ? `<b>🔥 ${S.ser.n}! День засчитан: ${wd} ${plural(wd,'день','дня','дней')}</b> на этой неделе → на следующей ${Math.min(wd,rateCap())}% бонусов.` : counted ? `<b>Покупка сохранена.</b> Этот день уже был засчитан.` : `<b>Покупка сохранена.</b> День засчитается, когда покупок за сегодня наберётся на ${MIN_DAY} ₽ (сейчас ${rub(dayTotal)}).`;

  if(weekOf(S.day)!==w){

        const k=pendNeed(); msg+=` 😟 ${pendTxt()}. ${S.plus?`Заморозь ${k} ${plural(k,'пропуск','пропуска','пропусков')} ❄️ до ${fmt(S.ser.pend.until)} — и ${S.ser.pend.n} ${plural(S.ser.pend.n,'посещение','посещения','посещений')} не сгорят.`:`Верни ★ Кофейная+ до ${fmt(S.ser.pend.until)} — и сохрани ${S.ser.pend.n} ${plural(S.ser.pend.n,'посещение','посещения','посещений')}.`}`; }
      else { const n0=S.ser.pend?S.ser.pend.n:S.ser.n; S.ser.pend=S.ser.pend||{weeks:[],n:S.ser.n}; S.ser.pend.weeks.push(w); burnPend();
        msg+=` 💔 На прошлой неделе было меньше ${SER_MIN} посещений, а заморозок не хватило — счётчик ${n0} сгорел. 👑 Лучший результат (${S.ser.best}) остался.`; } }
    if(S.plus&&d>=CHEST_MIN){ S.rw.chest={week:w,open:false}; msg+=` 🎁 За ${d} ${plural(d,'посещение','посещения','посещений')} — сундук с призом! Открой в «Турбо».`; }
    if(givePlat()) msg+=' 💎 Подарок Платинового: один напиток на выбор −50% (1 штука) — 3 дня.';
  }
  const gone=S.rw.gifts.filter(g=>!g.used&&!g.gone&&g.until<S.day); gone.forEach(g=>g.gone=true);
  if(gone.length&&S.plus) msg+=` 😢 Сгорел подарок: ${gone.map(g=>GIFT_KIND[g.kind].t.toLowerCase()).join(', ')}.`;
  if(S.rw.chest&&!S.rw.chest.open&&S.rw.chest.week<weekOf(S.day)-1) S.rw.chest.open='gone';

  for(const f of S.ref.friends){ if(f.hold!=null && !f.paid && S.day>=f.hold) refPay(f); }

function toastSwipe(t){ let y0=null,dy=0,drag=false,id=null;
  t.addEventListener('pointerdown',e=>{ y0=e.clientY; dy=0; drag=false; id=e.pointerId; });
  t.addEventListener('pointermove',e=>{ if(y0==null||e.pointerId!==id) return; const d=e.clientY-y0;
    if(!drag){ if(Math.abs(d)<6) return; drag=true; try{ t.setPointerCapture(id); }catch(_){} t.style.animation='none'; t.style.transition='none'; }
    dy=d<0?d:d/4; t.style.transform=`translateY(${dy}px)`; t.style.opacity=String(Math.max(.2,1+Math.min(0,dy)/140)); });
  const end=()=>{ if(y0==null) return; y0=null; if(!drag) return; t.style.transition='transform .22s ease-out,opacity .22s';
    if(dy<-28){ t.style.transform='translateY(-160%)'; t.style.opacity='0'; setTimeout(()=>t.remove(),220); }
    else { t.style.transform=''; t.style.opacity=''; }

function qrSvg(text, dark='#212221'){
  if(typeof qrcode!=='function') return `<svg viewBox="0 0 10 10"><text x="5" y="6" font-size="2" text-anchor="middle">${text}</text></svg>`;
  const q=qrcode(0,'H'); q.addData(text); q.make(); const n=q.getModuleCount(); let p='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) p+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-label="QR-код гостя"><path fill="${dark}" d="${p}"/></svg>`;
}

function storyRow(perks){ return `<div class="stories">${perks.filter(k=>!k.power&&k.n!==13).map(k=>`<button class="sty" onclick="${k.go}"><span class="sty-ring"><span class="sty-in" style="background:${k.bg}">${k.big}</span></span><span class="sty-t">${k.st||k.t}</span></button>`).join('')}${refCounter()}</div>`; }
/* Счётчик приглашённых друзей (владелец 25.10) — кружок как сторис: та же градиентная обводка, внутри ч/б композиция и крупная цифра;
   0 — серо-белое и тихое, есть друзья — цифра яркая; новое число набегает от прошлого показанного (S.refShown) */
function refCounter(){ const done=S.ref.friends.filter(f=>!f.blocked).length, from=Math.min(S.refShown??done,done);   // приглашённые = все засчитанные друзья (и уже с бонусом, и в пути)
  if(from!==done) setTimeout(()=>{ const el=document.querySelector('.ref-cnt .rc-n'); if(!el) return; let v=from; const st=()=>{ v++; el.textContent=v; el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),250); if(v<done) setTimeout(st,350); else { S.refShown=done; save(); } }; setTimeout(st,500); },0);
  return `<button class="sty ref-cnt${done?'':' zero'}" onclick="go('invite')" aria-label="Приглашённые друзья: ${done}"><span class="sty-ring"><span class="sty-in"><span class="rc-n">${from}</span></span></span><span class="sty-t">Приглашённые<br>друзья</span></button>`; }
const INV_POP=()=>`<div class="inv-pop"><button class="ti-x" onclick="S.invNext=S.day+14;save();render()" aria-label="Скрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="pi">👫</span><span class="tx"><b>Пригласи друга — +${REF_T} бонусов тебе и другу</b><small>Твои придут, когда друг сходит ${REF_DAYS} раза в разные дни</small></span><button class="btn" onclick="go('invite')">Пригласить</button></div>`;

/* Шкала цели недели: «кружок — линия — кружок», чтобы понял любой — и ребёнок, и бабушка */
function weekRow(){
  const w=weekOf(S.day);
  return `<div class="week">${WD.map((d,i)=>{ const day=w*7+i; const cls=[S.visits.includes(day)?'done':'', day===S.day?'today':'', day>S.day?'future':''].join(' ');
    return `<div class="day ${cls}"><span class="dot">${S.visits.includes(day)?'✓':dateOf(day).getDate()}</span>${d}</div>` }).join('')}</div>`;
}

function spy(){

let pd=null;
function openProduct(id){ const m=byId(id); pd={id, opts:defOpts(m), qty:1, more:{}}; drawProduct(); }
function drawProduct(){
  const m=byId(pd.id), x=m.vars[pd.opts.v], pp=myPrice(m.id), base=unitPrice(m,pd.opts), unit=pp!=null&&pd.opts.v===0? base-(m.p-pp) : base;
  const sixSl=S.plus&&sixSlotOf(m.id), six=!!sixSl, st=sixSl?sixSl.n:0, SOFF=sixSl?sixOff(sixSl):0, readyOk=six&&st>=5&&S.six.usedDay!==S.day;
  const sizes = m.vars.length>1 ? `<div class="optgroup"><strong>${m.vt||'Размер'}</strong><div class="seg" style="grid-template-columns:repeat(${m.vars.length},1fr)">${m.vars.map((v,i)=>`<button class="${pd.opts.v===i?'on':''}" onclick="pd.opts=defOpts(byId(pd.id),${i});drawProduct()">${v.l}</button>`).join('')}</div></div>` : '';
  const groups = x.g.map((g,gi)=>{ const one=g.max===1, sel=pd.opts.s[gi]||[], lim=pd.more[gi]?g.v.length:6;
    return `<div class="optgroup"><div class="stack" style="gap:0"><strong>${g.t}</strong>${g.min?`<span class="small muted">Минимум: ${g.min}</span>`:g.max>1&&g.max<g.v.length?`<span class="small muted">Можно выбрать до ${g.max}</span>`:''}</div>
      <div class="list">${g.v.slice(0,lim).map(([n,p],i)=>`<label class="opt" style="border-bottom:1px dashed var(--line)"><span>${n}${p?` <span class="muted">+ ${rub(p)}</span>`:''}</span><input type="${one?'radio':'checkbox'}" name="g${gi}" ${sel.includes(i)?'checked':''} onchange="pickOpt(${gi},${i})"></label>`).join('')}</div>
      ${g.v.length>6&&!pd.more[gi]?`<button class="link" style="align-self:flex-start" onclick="pd.more[${gi}]=1;drawProduct()">Показать ещё ${g.v.length-6}</button>`:''}</div>` }).join('');
  const html=`<div class="pd stack"${F(18)} style="gap:16px">${photo(m)}${readyOk?`<div class="party"><span class="pe">🎉</span><span><b>Ура, ты добежал!</b><br>Это твоё шестое: ${m.n.toLowerCase()} — на ${Math.round(SOFF*100)}% дешевле: <b>${rub(unit-Math.round(m.p*SOFF))}</b> вместо ${rub(unit)}. Скидка — на одну штуку.</span></div>`:''}
    <div class="stack" style="gap:4px"><h2>${m.n}</h2><span class="muted small">${wt(m,pd.opts.v)}${m.b?` · ${{new:'Новое',hit:'Хит! :)',chef:'Выбор шефа'}[m.b]}`:''}</span>${m.c?`<p class="small muted">Состав: ${m.c}</p>`:''}</div>
    ${six&&st<5?`<div class="hint-chip">${tiles(Math.min(st,5))}<span>${st>=5?'':`Отметок: ${st} из 5. Ещё ${5-st} ${plural(5-st,'раз','раза','раз')} — и шестое на ${Math.round(SOFF*100)}% дешевле.`}</span></div>`:''}
    ${pp!=null?`<div class="hint-chip" style="background:var(--blue);color:#f9f9f9">★ Ваша цена недели: ${rub(pp)} вместо ${rub(m.p)}</div>`:''}
    ${sizes}${groups}
    <div class="qtyrow sheet-foot"><div class="qty"><button aria-label="Меньше" onclick="pd.qty=Math.max(1,pd.qty-1);drawProduct()">−</button><span>${pd.qty}</span><button aria-label="Больше" onclick="pd.qty++;drawProduct()">+</button></div>
      ${(()=>{ const off=readyOk?Math.round(m.p*SOFF):0; return `<button class="btn${off?' btn-party':''}" style="flex:1" onclick="addFromPd()">${off?`<s style="opacity:.6;font-weight:400">${rub(unit*pd.qty)}</s> `:''}${rub(unit*pd.qty-off)} +</button>` })()}</div></div>`;
  const ex=document.querySelector('.sheet'); if(ex&&ex.querySelector('.pd')){ const s=ex.scrollTop; ex.innerHTML=SHX+html; ex.scrollTop=s; } else { sheet(html); if(readyOk) confetti(); }
}
function pickOpt(gi,i){
  const g=byId(pd.id).vars[pd.opts.v].g[gi], a=pd.opts.s[gi]||[];
  if(g.max===1) pd.opts.s[gi]=[i];
  else if(a.includes(i)) pd.opts.s[gi]=a.filter(x=>x!==i);
  else if(a.length>=g.max){ toast(`В группе «${g.t}» можно выбрать не больше ${g.max}.`); }
  else pd.opts.s[gi]=[...a,i];
  drawProduct();
}
function addFromPd(){ for(let i=0;i<pd.qty;i++) addLine(pd.id,JSON.parse(JSON.stringify(pd.opts)),true); const id=pd.id, psl=sixReady(id), party=!!psl; closeSheet(); refreshBasket(id);
  if(party){ confetti(); toast(`🎉 Ура! Твоё шестое в корзине: ${byId(id).n.toLowerCase()} — на ${Math.round(sixOff(psl)*100)}% дешевле.`,4000); } else toast(`${byId(id).n} — в корзине.`); }
/* Конфетти — праздник на 6-й позиции */
function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confetti'; const C=['#f2c230','#ff4f9a','#9bd9d9','#a7d2b9','#ff6d00','#5e35b1','#e53935'];
  for(let i=0;i<90;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=C[i%C.length]; p.style.animationDelay=(Math.random()*.4)+'s'; p.style.animationDuration=(1.6+Math.random()*1.2)+'s'; p.style.setProperty('--dx',(Math.random()*160-80)+'px'); p.style.setProperty('--r',(Math.random()*720-360)+'deg'); if(i%3===0) p.style.borderRadius='50%'; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3200); }

/* ---------- Корзина и оформление ---------- */
let co={bonus:false,wallet:false,when:'asap',at:null,comment:''};
/* «Ко времени» (владелец 25.10): вместо готовых вариантов — крутилка «день · часы · минуты»; не раньше чем через час
   от момента заказа, минуты кратны 15 (00 · 15 · 30 · 45), только пока кофейня работает (последнее время — 22:45) */
const WHEN_STEP=15, WHEN_LEAD=60, WHEN_LAST=22*60+45;
const whenOpen=d=>{ const x=new Date(); x.setDate(x.getDate()+d); return [0,6].includes(x.getDay())?9*60:8*60; };   // будни с 8:00, выходные с 9:00
const whenMin=d=>{ const n=new Date(), now=n.getHours()*60+n.getMinutes(); let m=whenOpen(d); if(d===0) m=Math.max(m,Math.ceil((now+WHEN_LEAD)/WHEN_STEP)*WHEN_STEP); return m; };
const whenDays=()=>[0,1].filter(d=>whenMin(d)<=WHEN_LAST);
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const atLbl=a=>(a.d?'Завтра':'Сегодня')+' к '+hm(a.t);
const atOk=a=>a&&whenDays().includes(a.d)&&a.t>=whenMin(a.d)&&a.t<=WHEN_LAST;
let wsel=null;

function powerItems(){ const it=powerAll(); if(S.plus) return it;
  const pl=it.find(x=>x.t==='Кофейная+');
  return [pl,...it.filter(x=>x!==pl).map(x=>({...x,on:false,no:'Откроется с ★ Кофейная+',act:'Подключить ★',btn:"go('plus')"}))]; }
// Подпись «Твой ритм — работает»: сколько бонусов сейчас и что будет с понедельника (процент этой недели от покупок этой недели не меняется)
function rhYes(lw,tw){ const cap=rateCap(), now=rateAll(), next=Math.min(tw,cap)+tierPlus();
  if(lw>=cap&&tw>=cap) return `${now}% бонусов — это максимум 🎉`;
  if(lw>=cap) return `Сейчас ${now}% бонусов — это максимум 🎉|Приходи каждый день — и он останется`;
  if(!lw) return tw>=cap?`С понедельника ${next}% бонусов — это максимум 🎉`:`С понедельника ${next}% бонусов с каждой покупки|Ещё день — и будет ${next+1}%`;
  if(tw>lw) return `Сейчас ${now}% бонусов с каждой покупки|С понедельника будет ${next}%`;
  if(tw===lw) return `Сейчас ${now}% бонусов с каждой покупки|Приходи ещё раз — с понедельника будет ${next+1}%`;
  return `Сейчас ${now}% бонусов с каждой покупки|Приходи ещё ${lw-tw} ${plural(lw-tw,'раз','раза','раз')} — и с понедельника будет столько же`; }
function powerAll(){
  const lw=lastWeekDays(), tw=weekDays(weekOf(S.day)), wal=walletTotal(), fr=S.ref.friends.filter(f=>!f.blocked).length, spent=S.orders.some(o=>o.bonusSpend>0);

    {ic:'☀️', t:'Предложение дня',  on:S.funnel.used>0,                 yes:'Пользуешься — каждый день новое',            no:'Скидка под твой вкус, каждый день новая|Используй её на кассе или в заказе', act:'Воспользоваться', btn:"goTo('home','#offer')"},

    {ic:'📈', t:'Твой ритм',        on:lw>0||tw>0,                      yes:rhYes(lw,tw),                                 no:'Купи сегодня от 150 ₽|С понедельника пойдут бонусы', act:'В меню', btn:"go('menu')"},

  const fd=x=>{ const y=dateOf(x); return y.getDate()+' '+MON[y.getMonth()]; };
  const chips=benChips().map(([k,t])=>[k==='all'?'all':k,k==='all'?'Всё':t]).map(([k,t])=>`<button class="${histPer===k?'on':''}" onclick="openHistory('${k}')">${t}</button>`).join('');
  const days=[...new Set(os.map(o=>o.day))];
  const sum=os.reduce((a,o)=>a+o.sum,0), saved=os.reduce((a,o)=>a+(o.saved||0),0);
  const body=!S.orders.length?'<p class="small muted" style="margin:0">Покупок пока нет — они появятся здесь после первой покупки на кассе или в приложении</p>'
    :!os.length?`<p class="small muted" style="margin:0">${lo===hi?`${fd(lo)} покупок не было`:`С ${fd(lo)} по ${fd(hi)} покупок не было`}<br>Выбери другие даты</p>`
    :days.map(d=>{ const ds=os.filter(o=>o.day===d), tot=ds.reduce((a,o)=>a+o.sum,0);
      return `<div class="h-day"><span>${fmt(d)}</span><b class="money">${rub(tot)}</b></div>`+ds.map(o=>`<div class="h"><span>${o.items.map(i=>byId(i).n).join(', ')}</span><span class="money">${rub(o.sum)}</span>
      <span class="d">${o.ch||'Касса'}${o.saved?` · <span class="save">экономия ${rub(o.saved)}</span>`:''} · бонусы +${o.bonus}${o.bonusSpend?` −${o.bonusSpend}`:''}</span></div>`).join(''); }).join('');
  const html=`<div id="hist-root"><h2>История покупок</h2>
    ${S.orders.length?`<div class="ben-per">${chips}</div>
    ${histPer==='custom'?`<div class="ben-dates"><label>с<button class="bd-pick" onclick="openBenCal('from','hist')">${fd(lo)}</button></label><label>по<button class="bd-pick" onclick="openBenCal('to','hist')">${fd(hi)}</button></label></div>`:''}
    ${os.length?`<div class="h-sum"><span>${os.length} ${plural(os.length,'покупка','покупки','покупок')} · ${lo===hi?fd(lo):`с ${fd(lo)} по ${fd(hi)}`}</span><b class="money">${rub(sum)}</b>${saved?`<small class="save">экономия ${rub(saved)}</small>`:''}</div>`:''}`:''}
    <div class="hist">${body}</div></div>`;
  // 25.10: фильтр не переоткрывает окно (дёргалось и прыгало) — меняем только содержимое, высота окна та же
  const cur=document.getElementById('hist-root'); if(cur){ cur.outerHTML=html; return; }
  sheet(html,1); }

function giftSend(){ const p=giftPrice(), t=gf.to, m=gf.kind==='dish'?byId(gf.item):null;

  const g={day:S.day, to:{key:t.key,n:t.n,short:t.short,via:t.via,gi:t.gi}, kind:gf.kind, item:m?m.id:null, price:m?m.p:0, pay:{bonus:p.bonus,dep:p.dep,card:p.card}, until:m?S.day+GIFT_DISH_DAYS:null, st:m?'wait':'done', msg:(gf.msg||'').trim()};

// новый день: подарки-блюда гостям из приложения забирают на следующий день (демо), остальные ждут; просроченные — возврат дарителю
function giftDay(){ let msg=''; for(const g of S.gft.sent){ if(g.st!=='wait') continue;

    if(S.day>g.until){ g.st='back'; S.bonus+=g.pay.bonus; const back=g.pay.dep+g.pay.card; if(back){ S.wallet.money+=back; (S.wallet.ops=S.wallet.ops||[]).push({day:S.day,k:'top',t:`Возврат: подарок «${byId(g.item).n}» не забрали`,sum:back}); }
      msg+=` 🎁 Подарок «${byId(g.item).n}» не забрали — ${back?rub(back)+' вернулись на депозит':''}${g.pay.bonus&&back?', ':''}${g.pay.bonus?g.pay.bonus+' бонусов вернулись':''}.`; } }
  return msg; }

// Перейти на вкладку и прокрутить к нужному блоку (якорь) — чтобы кнопка вела ровно туда, где выгода
function goTo(t,sel){ go(t); setTimeout(()=>{ const el=document.querySelector(sel); if(el){ const y=el.getBoundingClientRect().top+scrollY-90; scrollTo({top:y,behavior:'smooth'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1600); } },60); }
/* История переходов (владелец 25.10: «Назад» с депозита кидало в «Турбо»): «← Назад» возвращает туда, откуда пришёл,
   и на то же место прокрутки. Переход на вкладку нижнего меню (Меню · Турбо · Профиль) начинает историю заново.
   go(t,1) — заменить текущий экран, не запоминая его (после оформления заказа корзина пустая — туда не возвращаем) */
const TOP_TABS=['menu','home','progress','profile'];
let navStack=[], navAnim=null;
/* Раздел, из которого человек зашёл вглубь (25.10, с критиком): по нему — логотип, повторное нажатие на вкладку и подсветка вкладки
   (депозит, открытый из «Турбо», — это «Турбо»); переживает перезагрузку */
const secOf=t=>t==='progress'?'home':t;
let secRoot=null;
function setRoot(r){ secRoot=secOf(r); try{localStorage.setItem(KEY+'-root',secRoot)}catch(e){} }
const curSec=()=>TOP_TABS.includes(tab)?secOf(tab):(secRoot||TAB_OF[tab]||'home');
// очищая историю приложения, убираем и её записи в истории браузера — иначе системный «назад» (свайп) несколько раз «мёртвый»
function navClear(){ const n=navStack.length; navStack=[]; if(n){ navSkip++; try{ history.go(-n); }catch(e){ navSkip--; } } }   // navAnim: 'fwd' — экран въезжает справа (провалился внутрь), 'back' — слева
// с критиком 25.10: цикл A→B→A→B не растит историю (обрезаем до экрана, если он уже был); не больше 10 шагов;
// системный «назад» телефона/браузера (свайп в Safari) — тот же стек; если открыта шторка — сначала закрывает её
function go(t,replace){ if(t==='qr'){ openQR(); return; }
  if(t==='lab'&&tab!=='lab') labSixD=null;   // черновик «Каждого 6-го» в пульте — заново при входе
  if(TOP_TABS.includes(t)){ navClear(); setRoot(t); }
  else if(t!==tab && !replace){ const k=navStack.findIndex(x=>x.t===t);
    if(k>=0){ const d=navStack.length-k; navStack=navStack.slice(0,k); navSkip++; try{ history.go(-d); }catch(e){ navSkip--; } } else { navStack.push({t:tab,y:scrollY}); if(navStack.length>10) navStack.shift(); histPush(); } }
  if(!TOP_TABS.includes(t) && t!==tab) navAnim='fwd';
  tab=t; render(false); scrollTo(0,0); try{localStorage.setItem(KEY+'-tab',t)}catch(e){} }
function navPop(fallback){ const p=navStack.pop(); if(!p){ go(fallback||TAB_OF[tab]||'home'); return; }
  navAnim='back'; tab=p.t; if(TOP_TABS.includes(tab)) setRoot(tab); render(false); scrollTo(0,Math.min(p.y||0,document.documentElement.scrollHeight)); try{localStorage.setItem(KEY+'-tab',p.t)}catch(e){} }
let navSkip=0, pendPush=0;
// пока браузер ещё отматывает историю (history.go/back — не сразу), новые записи откладываем: иначе отмотка снесёт и их
function histPush(){ if(navSkip>0){ pendPush++; return; } try{ history.pushState({nav:navStack.length},''); }catch(e){} }   // «Назад» в приложении возвращает сразу; запись в истории браузера убираем следом, а её событие пропускаем
/* Логотип (владелец 25.10): возвращает в начало того раздела нижнего меню (Меню · Турбо · Профиль), откуда человек «забурился»;
   если уже в начале раздела — просто наверх страницы */
function goHome(){ closeSheet(); const r=curSec();
  if(TOP_TABS.includes(tab)&&secOf(tab)===r){ scrollTo({top:0,behavior:'smooth'}); return; }
  navClear(); navAnim='back'; tab=r; setRoot(r); render(false); scrollTo(0,0); try{localStorage.setItem(KEY+'-tab',tab)}catch(e){} }
/* Повторное нажатие на вкладку нижнего меню (владелец 25.10, как в iPhone): уже в этом разделе — в его начало, наверх страницы
   (в начале раздела — плавная прокрутка; на внутреннем экране — назад, в корень раздела); другой раздел — обычный переход */
function tabTap(id){ if(curSec()!==id){ go(id); return; } closeSheet();
  if(TOP_TABS.includes(tab)){ scrollTo({top:0,behavior:'smooth'}); return; }
  navClear(); navAnim='back'; tab=id; setRoot(id); render(false); scrollTo(0,0); try{localStorage.setItem(KEY+'-tab',tab)}catch(e){} }
function goBack(fallback){ if(navStack.length){ navSkip++; try{ history.back(); }catch(e){ navSkip--; } } navPop(fallback); }
addEventListener('popstate',()=>{
  if(navSkip>0){ navSkip--; if(!navSkip&&pendPush){ const k=pendPush; pendPush=0; for(let i=0;i<k;i++) try{ history.pushState({nav:navStack.length-k+i+1},''); }catch(e){} } return; }
  if(document.querySelector('.sheet-bg')){ closeSheet(); try{ history.pushState({nav:navStack.length},''); }catch(e){} return; }
  if(navStack.length) navPop(); });

let authStep='phone';

  return `<div class="auth">

        <div class="field"><label class="label" for="phone">Номер телефона</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 123-45-67" value="${S.phone||'+7 '}" oninput="maskPhone(this)"></div>
        <button class="btn block" type="submit">Получить код по СМС</button></form>`
    : `<form class="stack" style="gap:16px" onsubmit="event.preventDefault();checkCode()">

        <button class="btn block" type="submit">Войти</button></form>`}
  </div>`;

function maskPhone(el){ let d=el.value.replace(/\D/g,''); if(d.startsWith('8')) d='7'+d.slice(1); if(!d.startsWith('7')) d='7'+d; d=d.slice(0,11);
  const p=[d.slice(1,4),d.slice(4,7),d.slice(7,9),d.slice(9,11)]; let s='+7'; if(p[0]) s+=' '+p[0]; if(p[1]) s+=' '+p[1]; if(p[2]) s+='-'+p[2]; if(p[3]) s+='-'+p[3]; el.value=s; }
function sendCode(){ const v=$('#phone').value; if(v.replace(/\D/g,'').length<11){ toast('Введите номер полностью: 10 цифр после +7.'); return; } S.phone=v; authStep='code'; save(); render(); $('#code')?.focus(); }
function codeIn(el){ el.value=el.value.replace(/\D/g,'').slice(0,4); if(el.value.length===4) checkCode(); }
function checkCode(){ const c=$('#code').value; if(c.length<4){ toast('Введите все 4 цифры кода.'); return; } S.authed=true; save(); tab='home'; setRoot('home'); render(false); if(!S.onb) setTimeout(openOnb,300); toast('Добро пожаловать! 👋'); }

const SHX='<button class="sheet-x" onclick="closeSheet()" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'; // крестик закрытия во всех шторках (вместо свайпа)
function sheet(html,full){ closeSheet(); const bg=document.createElement('div'); bg.className='sheet-bg'+(full?' full':''); bg.onclick=e=>{ if(e.target===bg) closeSheet() };
  bg.innerHTML=`<div class="sheet${full?' full':''}" role="dialog" aria-modal="true">${SHX}${html}</div>`; document.body.appendChild(bg); lockScroll(); document.addEventListener('keydown',escClose); }
/* Пока открыта шторка — страница под ней замирает на месте, а после закрытия остаётся там же, где была */
let sheetY=0;
function lockScroll(){ const h=document.documentElement; if(h.classList.contains('sheet-open')) return; sheetY=scrollY; h.classList.add('sheet-open'); document.body.style.top=-sheetY+'px'; }
function unlockScroll(){ const h=document.documentElement; if(!h.classList.contains('sheet-open')) return; h.classList.remove('sheet-open'); document.body.style.top=''; scrollTo(0,sheetY); }
function escClose(e){ if(e.key==='Escape') closeSheet() }
function closeSheet(){ supOpenNow=false; document.querySelectorAll('.sheet-bg').forEach(x=>x.remove()); unlockScroll(); clearInterval(qrTimer); document.removeEventListener('keydown',escClose); }

let kc={}, ko={};

}

/* Напоминание «не дай посещениям сгореть» (24.10, с критиком) — единственный пуш, который работает на цель 3→4→5.
   Спрашиваем один раз: сразу после первой покупки, которая запустила счётчик (0 → 1), только с Кофейная+. «Не надо» — больше не спрашиваем */

  setTimeout(()=>{ document.querySelectorAll('.toast').forEach(t=>t.remove()); sheet(`<div class="rem"><span class="rem-ic">🔥</span><h2>Напомнить, если посещения могут сгореть?</h2>

    <button class="btn ghost block" onclick="S.remind=false;save();closeSheet()">Не надо</button></div>`); },1800); }
function payKassa(){ const qt=quote(Object.entries(kc).map(([id,qty])=>({id,qty,sur:0})),ko); if(!qt.lines.length) return; const msg=applyPurchase(qt,'Касса',ko.doc); save(); closeSheet(); render(); toast(msg,4500); askRemind(); }

      <div class="lab-wd">${TARIFFS.map(x=>`<button class="${S.tariff===x.k?'on':''}" onclick="setTariff('${x.k}')">${x.n}</button>`).join('')}</div>
      ${rng('Посещений подряд',S.ser.n,0,400,'labSer')}
      ${rng('Лучший результат',S.ser.best,S.ser.n,500,'labBest')}
      <span class="lab-l">Эта неделя — нажимай на день: 🔥 был → ❄️ заморозка → ✕ пропуск</span>
      <div class="lab-wk">${WD.map((x,i)=>{ const d=w*7+i, v=S.visits.includes(d), f=fd.has(d), fut=d>S.day;
        return `<button class="${fut?'fut':v?'v':f?'f':d===S.day?'':'x'}" ${fut?'disabled':''} onclick="labCell(${i})"><i>${fut?'':v?'🔥':f?'❄️':d===S.day?'?':'✕'}</i>${x}</button>`; }).join('')}</div>
      ${rng('Посещений на прошлой неделе',lw,0,7,'labLastWeek',` → ${Math.min(lw,PLUS_CAP)}%`)}
      ${rng('Заморозок осталось в этом месяце',fzMonthLeft(),0,FZ_MONTH,'labFzMonth')}
      ${t.vac?rng('Дней на отпуск осталось',fzVacLeft(),0,t.vac,'labFzVac'):''}
      ${tg('Счётчик ждёт решения (пропустил неделю)',!!S.ser.pend,'labPend')}
      <button class="btn ghost block" onclick="labBurn()">💔 Сжечь счётчик</button>
      <div class="lab-grid">${num('Бонусы',S.bonus,'S.bonus')}${num('Депозит, ₽',S.wallet.money,'S.wallet.money')}${num('Кэшбэк, ₽',S.wallet.gift,'S.wallet.gift')}</div></div>

    <div class="lab-b"><h2>4. Выгоды и подарки</h2>
      <span class="lab-l">Предложение дня</span>
      <div class="lab-wd">${[['shown','Показано'],['activated','Активировано'],['used','Использовано']].map(([k,n])=>`<button class="${S.offer&&S.offer.status===k?'on':''}" onclick="labOffer('${k}')">${n}</button>`).join('')}</div>
      ${tg('6-е ждёт со скидкой −50% (новое для тебя блюдо)',S.six.slots.some(x=>x&&x.n>=5&&x.isNew),'labSixNew')}
      ${tg('6-е ждёт со скидкой −20% (привычное блюдо)',S.six.slots.some(x=>x&&x.n>=5&&!x.isNew),'labSixOld')}
      ${labSixBox()}<button class="btn ghost block" onclick="labDo(()=>{S.six.ai={last:null,no:{},cur:null};S.histPast=[...(S.histPast||[]),...Array.from({length:8},(_,i)=>S.day-20-i)]},'Подсказка ИИ появится, если есть свободная ячейка')">💡 Показать подсказку ИИ (8 дней с покупками)</button>
      ${rng('День рождения через (дней)',bd.diff??40,-10,40,'labBd')}${bd.set?'':'<span class="lab-l">Дата не указана — сдвинь ползунок, чтобы указать</span>'}
      ${tg('Друг приглашён (ещё не купил 3 раза — бонусов пока нет)',S.ref.friends.some(f=>!f.blocked),'labFriend')}
      <button class="btn block" onclick="labRefPaid()">👫 Друг выполнил условия — получить +${REF_T} бонусов</button>
      <div class="lab-row"><button class="btn ghost" onclick="labChest()">🎁 Сундук ждёт</button><button class="btn ghost" onclick="labGift('drink50')">☕ Подарок −50%</button><button class="btn ghost" onclick="labGift('sweet50',1)">🔥 Подарок сгорает сегодня</button></div>
      <div class="lab-row"><button class="btn ghost" onclick="labDo(()=>{S.rw.gifts=[];S.rw.chest=null},'Подарки убраны')">Убрать подарки</button><button class="btn ghost" onclick="labDo(()=>{S.rw.miles={}},'Праздники снова сработают')">Сбросить праздники</button></div>
      <span class="lab-l">Подарки другим и поиск</span>
      <div class="lab-row"><button class="btn ghost" onclick="openSupport()">💬 Поддержка</button><button class="btn ghost" onclick="S.sup.nightDemo=!S.sup.nightDemo;save();render();toast(S.sup.nightDemo?'Поддержка как ночью: ответ придёт после «Завтра →»':'Поддержка — дневной режим')">${S.sup.nightDemo?'🌙 Ночь: вкл':'🌙 Поддержка ночью'}</button></div>
      <div class="lab-row"><button class="btn ghost" onclick="openGift()">🎁 Подарить</button><button class="btn ghost" onclick="openSearch()">🔍 Поиск</button><button class="btn ghost" onclick="labDo(()=>{S.gft={sent:[],recent:[]};S.srch=[]},'Подарки другим и история поиска очищены')">Сбросить подарки</button></div>
      <span class="lab-l">Покупка на кассе (капучино на любую сумму)</span>
      <div class="lab-buy"><input id="lab-sum" type="number" inputmode="numeric" value="150"><span>₽</span><label><input id="lab-bon" type="checkbox"> оплатить бонусами</label><button class="btn" onclick="labBuy()">Купить</button></div>
      <p class="small muted" style="margin:0">Дважды «Купить» в один день — проверка «несколько чеков = один день». 149 ₽ — день не засчитается</p></div>

    <div class="lab-row"><button class="btn ghost" onclick="openOnb()">Показать онбординг</button><button class="btn ghost" onclick="resetDemo()">Сбросить демо</button></div>
  </section>`;
}
function labPlus(v){ labDo(()=>{ S.plus=v; S.plusSoon=false; }); }
/* Пульт «Каждый 6-й» (владелец 25.10): в каждой из 3 ячеек выбрать блюдо и сколько раз уже куплено (0–5),
   изменения применяются только кнопкой «Применить» — потом сразу показываем карточку в «Турбо» */
let labSixD=null;
// пульт (владелец 25.10): галочкой — сразу «шестое ждёт» со скидкой −50% (новое) или −20% (привычное), и показываем карточку
function labSixReady(isNew,on){ const sl=S.six.slots, k=sl.findIndex(x=>x&&x.n>=5&&!!x.isNew===isNew);
  if(!on){ if(k>=0) sl[k]=null; save(); render(); return; }
  if(k<0){ const taken=new Set(sl.filter(Boolean).map(x=>x.id)), all=SIX_POOL.flatMap(g=>g.ids);
    const id=isNew?all.find(x=>!taken.has(x)&&!boughtWithin(x,SIX_NEW_WINDOW)):(!taken.has(ID.cap)?ID.cap:all.find(x=>!taken.has(x)&&boughtWithin(x,SIX_NEW_WINDOW)))||all.find(x=>!taken.has(x));
    let i=sl.findIndex(x=>!x); if(i<0) i=sl.findIndex(x=>!(x.n>=5)); if(i<0) i=isNew?1:0;
    sl[i]={id,n:5,isNew,last:S.day,ready:S.day}; }
  S.six.usedDay=null; labSixD=null; save(); toast(S.plus?`Шестое ждёт: −${isNew?50:20}%<br>Вот как это выглядит`:'Готово, но без ★ Кофейная+ «Каждый 6-й» под замком'); goTo('progress','#pr-six'); }
const labSixNew=on=>labSixReady(true,on), labSixOld=on=>labSixReady(false,on);
function labSixBox(){ if(!labSixD) labSixD=S.six.slots.map(sl=>sl?{id:sl.id,n:Math.min(5,sl.n)}:{id:'',n:0});
  const opts=sel=>`<option value="">— пусто —</option>`+SIX_POOL.map(g=>`<optgroup label="${g.t}">${g.ids.map(id=>`<option value="${id}"${id===sel?' selected':''}>${byId(id).n}</option>`).join('')}</optgroup>`).join('');
  return `<span class="lab-l">«Каждый 6-й»: какие блюда копишь и сколько раз уже купил</span>
    <div class="lab-six">${labSixD.map((d,i)=>`<div class="ls-row"><b>${i+1}</b><select onchange="labSixD[${i}].id=this.value;labSixDirty()">${opts(d.id)}</select>
      <select onchange="labSixD[${i}].n=+this.value;labSixDirty()">${[0,1,2,3,4,5].map(n=>`<option value="${n}"${n===d.n?' selected':''}>${n===5?'куплено 5 — шестое ждёт':'куплено '+n}</option>`).join('')}</select></div>`).join('')}</div>
    <button class="btn block" id="lab-six-go" onclick="labSixApply()">Применить</button>
    <p class="small muted" id="lab-six-tip" style="margin:0">Выбери и нажми «Применить» — покажем, как это выглядит</p>`; }
function labSixDirty(){ const b=document.getElementById('lab-six-go'), t=document.getElementById('lab-six-tip'); if(b) b.classList.add('lab-dirty'); if(t) t.textContent='Есть изменения — нажми «Применить»'; }
function labSixApply(){ const ids=labSixD.map(d=>d.id).filter(Boolean); if(new Set(ids).size<ids.length) return toast('Одно блюдо выбрано дважды<br>Выбери разные');
  S.six.slots=labSixD.map(d=>d.id?{id:d.id,n:d.n,isNew:!boughtWithin(d.id,SIX_NEW_WINDOW),last:S.day,ready:d.n>=5?S.day:null}:null);
  S.six.usedDay=null; labSixD=null; save(); toast(S.plus?'Применено ✓<br>Вот как это выглядит':'Применено ✓<br>Но без ★ Кофейная+ «Каждый 6-й» под замком — включи подписку в пульте'); goTo('progress','#pr-six'); }
function labStamp(v){ labDo(()=>{ const sl=S.six.slots[0]||(S.six.slots[0]={id:ID.cap,n:0,isNew:false,last:S.day}); sl.n=v; sl.last=S.day; sl.ready=v>=5?S.day:null; }); }

/* ===================== Рендер ===================== */
function fitPrivi(){ document.querySelectorAll('.privi-head').forEach(h=>{ const nm=h.querySelector('.privi-name'), b=h.querySelector('.plus-on'); if(!nm||!b) return;
  h.classList.remove('wrap'); nm.style.fontSize=''; const out=()=>b.getBoundingClientRect().right>h.getBoundingClientRect().right+0.5||nm.scrollWidth>nm.clientWidth+1||b.scrollWidth>b.clientWidth+1;
  nm.classList.remove('brk'); let f=parseFloat(getComputedStyle(nm).fontSize); const f0=f; while(out()&&f>20){ f-=1; nm.style.fontSize=f+'px'; }
  if(out()){ h.classList.add('wrap'); f=f0; nm.style.fontSize=''; while(out()&&f>16){ f-=1; nm.style.fontSize=f+'px'; } if(out()) nm.classList.add('brk'); } });
  // имя в приветствии «Турбо»: уменьшаем до 24px, дальше переносим по словам (длинное имя не выходит за экран)
  document.querySelectorAll('.hello .hname').forEach(nm=>{ nm.style.fontSize=''; nm.classList.remove('brk'); let f=parseFloat(getComputedStyle(nm).fontSize);
    while(nm.scrollWidth>nm.clientWidth+1&&f>24){ f-=1; nm.style.fontSize=f+'px'; } if(nm.scrollWidth>nm.clientWidth+1) nm.classList.add('brk'); }); }
addEventListener('resize',()=>requestAnimationFrame(fitPrivi)); try{ document.fonts.ready.then(fitPrivi); }catch(e){}
function render(keep=true){
  const app=$('#app'), locked=document.documentElement.classList.contains('sheet-open'), y=locked?sheetY:scrollY;
  if(!S.authed){ app.className='app'; app.innerHTML=auth(); return; }
  ensureDaily();
  const body=(SCREENS[tab]||home)(), active=curSec();
  app.className='app'+(basketCount()&&CART_TABS.includes(tab)?' has-cart':'')+' glass'; // «жидкое стекло» (iOS 26) — на всех вкладках
  // демо-полоса (Касса · Завтра · Пульт) — не сверху, а внизу экранов «Турбо» и «Профиль» (владелец 24.10: сверху слишком много закреплено)
  app.innerHTML = gbar() + `<main${navAnim?` class="nav-${navAnim}"`:''}>${body}${['home','profile'].includes(active)?`<div class="demo-foot">${demoBar()}</div>`:''}</main>` + cartbarHtml() +
    `<nav class="tabs t3" aria-label="Разделы"><div class="in">${TABS.map(([id,t,ic])=> id==='home'
      ? `<button class="turbotab" onclick="tabTap('home')" ${active===id?'aria-current="page"':''}><span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg></span>${t}</button>`
      : `<button onclick="tabTap('${id}')" ${active===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${t}${id==='profile'&&S.sup.unread?`<i class="tab-dot">${S.sup.unread}</i>`:''}</button>`).join('')}</div></nav>`;
  navAnim=null; fitPrivi(); setTimeout(fitPrivi,60);   // и после типографики (неразрывные пробелы меняют ширину)
  if(locked) sheetY=keep?y:0; else if(keep) scrollTo(0,y);
  if(tab==='menu') spy();
  if(tab==='plus') plusFloatWatch();
  pinStuck();
}
// полоса «рекорд · посещения · место» прилипла к верхней полосе — убираем скругления на стыке
function pinStuck(){ const p=document.querySelector('.ser-pin,.catbar'), g=document.querySelector('.gbar'), app=document.getElementById('app'); if(!app) return;
  app.classList.toggle('pin-stuck', !!(p&&g) && p.getBoundingClientRect().top <= g.getBoundingClientRect().bottom+1); }
addEventListener('scroll',()=>requestAnimationFrame(pinStuck),{passive:true});
try{ const t=localStorage.getItem(KEY+'-tab'); if(t && SCREENS[t] && t!=='order') tab=t; }catch(e){}
try{ const r=localStorage.getItem(KEY+'-root'); secRoot=TOP_TABS.includes(tab)?secOf(tab):(['home','menu','profile'].includes(r)?r:(TAB_OF[tab]||'home')); }catch(e){ secRoot=TAB_OF[tab]||'home'; }
// после перезагрузки истории приложения нет — убираем старые записи из истории браузера, чтобы свайп «назад» не был «мёртвым»
try{ const k=history.state&&history.state.nav; if(k>0){ navSkip++; history.go(-k); } }catch(e){}
try{ const k=sessionStorage.getItem('labPreset'); if(k){ sessionStorage.removeItem('labPreset'); labApplyPreset(k); } }catch(e){}
render(false);
if(S.authed && !S.onb) setTimeout(openOnb,300);
setTimeout(refCheck,600);   // друг выполнил условия, пока гостя не было — праздник при входе
</script>
