<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<base href="../"><!-- меню, фото блюд и кофеен — общие с приложением -->
<title>Бэк-офис · Кофейная</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Dela+Gothic+One&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface2:#f8f9f7; --ink:#212221; --muted:#666b67; --line:#e1e4df; --line2:#cfd4cd;
  --side:#172f28; --side-ink:#e8efe9; --side-mut:#9fb6aa; --side-on:#a7d2b9;
  --acc:#0d553f; --acc2:#3f9a72; --acc-ink:#ffffff; --acc-soft:#e3f1e9;
  --red:#c62828; --red-soft:#fdecea; --amber:#b26a00; --amber-soft:#fff3dd; --blue:#2b2b93; --blue-soft:#ecebfb;
  --prem:linear-gradient(120deg,#2b2b93,#5e35b1 55%,#00657f);
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --r:12px; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1d201e; --surface2:#232624; --ink:#eef1ee; --muted:#a2a8a3; --line:#313532; --line2:#424743;
  --side:#0f1f1a; --acc:#5fbf92; --acc2:#3f9a72; --acc-ink:#0b1f17; --acc-soft:#1c3329;
  --red:#ff7a6e; --red-soft:#3a1f1d; --amber:#f0b25a; --amber-soft:#3a2d17; --blue:#a9a6ff; --blue-soft:#25244a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1d201e; --surface2:#232624; --ink:#eef1ee; --muted:#a2a8a3; --line:#313532; --line2:#424743;
  --side:#0f1f1a; --acc:#5fbf92; --acc2:#3f9a72; --acc-ink:#0b1f17; --acc-soft:#1c3329;
  --red:#ff7a6e; --red-soft:#3a1f1d; --amber:#f0b25a; --amber-soft:#3a2d17; --blue:#a9a6ff; --blue-soft:#25244a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
.num,.kpi b{font-family:var(--f-num);font-weight:400;font-variant-numeric:proportional-nums;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:12.5px} .nowrap{white-space:nowrap}

/* каркас */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 24px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;color:#fff;text-decoration:none}
.brand svg.mk{width:34px;height:25px;fill:#a7d2b9;flex:none}
.brand svg.wd{width:120px;height:15px;fill:#fff;display:block}
.brand small{display:block;color:var(--side-mut);font-size:11.5px;margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.nav-g{font:600 11px/1 var(--f-head);text-transform:uppercase;letter-spacing:.08em;color:var(--side-mut);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-size:14px}
.nav a .i{width:22px;text-align:center;flex:none;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(167,210,185,.16);color:#fff;box-shadow:inset 3px 0 0 var(--side-on)}
.nav a .cnt{margin-left:auto;background:#e53935;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px;margin-left:-6px;cursor:pointer}
.burger svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none}
.crumbs{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who select{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 8px}
.page{padding:22px 24px 80px;max-width:1240px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph .t{flex:1;min-width:240px}
.ph p{margin:6px 0 0;color:var(--muted);max-width:760px}

/* элементы */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:16px}
.card h2+p,.card h3+p{margin:4px 0 0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),#0d553f);border-color:transparent;color:#fff}
.btn.red{background:var(--red);border-color:transparent;color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.pill.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.pill.amb{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.prem{background:var(--prem);color:#fff;border:0}
.pill.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.star{color:#f2c230}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-size:26px;margin:6px 0 2px;line-height:1.1}
.kpi small{color:var(--muted);font-size:12px}
.kpi small.up{color:var(--acc)} .kpi small.dn{color:var(--red)}
.kpi.main{background:linear-gradient(135deg,#172f28,#0d553f);color:#fff;border-color:transparent}
.kpi.main span,.kpi.main small{color:#cfe6d9}

/* таблица */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 12px/1.2 var(--f-head);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface2);display:block;flex:none}
.cell-n{display:flex;align-items:center;gap:10px;min-width:180px}
.cell-n b{display:block;font-weight:500}
.ava{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#212221}

/* формы */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:38px}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);outline-offset:0;border-color:var(--acc)}
.inp.err{border-color:var(--red)}
.u-wrap{display:flex;align-items:stretch}
.u-wrap .inp{border-top-right-radius:0;border-bottom-right-radius:0}
.u-wrap i{font-style:normal;display:grid;place-items:center;padding:0 10px;border:1px solid var(--line2);border-left:0;border-radius:0 9px 9px 0;background:var(--surface2);color:var(--muted);white-space:nowrap;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap} .row>*{flex:1;min-width:150px}
.sw{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:20px;background:var(--line2);transition:.15s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--acc2)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:disabled+i{opacity:.5;cursor:not-allowed}
.tog{display:flex;align-items:center;gap:12px;justify-content:space-between}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search .inp{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

/* параметры механик */
.prm{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(220px,1fr);gap:8px 22px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.prm:first-of-type{border-top:0}
.prm .l b{display:block;font-weight:500}
.prm .l p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.prm .l .cur{font-size:12px;color:var(--muted);margin-top:4px}
.prm .l .risk{font-size:12px;color:var(--amber);margin-top:4px}
.prm.chg{background:linear-gradient(90deg,var(--amber-soft),transparent 70%);margin:0 -18px;padding:14px 18px}
.prm .code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.list-ed{display:flex;flex-direction:column;gap:6px}
.list-ed .li{display:flex;gap:6px;align-items:center}
.list-ed .li .inp{min-height:34px;padding:6px 9px}
.x{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--red-soft);color:var(--red)}
.savebar{position:sticky;bottom:0;z-index:15;margin:18px -24px -80px;padding:12px 24px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .sp{flex:1}

/* вкладки */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}

/* окна */
.ov{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;justify-content:flex-end}
.dr{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.dr-h{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.dr-h h2{flex:1;min-width:0}
.dr-b{padding:18px 20px 40px}
.ov.c{justify-content:center;align-items:center;padding:16px}
.md{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md-h{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.md-h h2{flex:1}
.md-b{padding:8px 20px 20px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px;flex-wrap:wrap}
.cls{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.cls svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;background:linear-gradient(135deg,#382d2b,#4e3b35);color:#fef2e9;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(560px,calc(100% - 32px));font-size:14px;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.note{border-radius:10px;padding:10px 14px;background:var(--amber-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.ok{background:var(--acc-soft)} .note.red{background:var(--red-soft)} .note.blue{background:var(--blue-soft)}
.note b{font-weight:600}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),#0d553f);border-radius:5px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .c i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#3f9a72,#0d553f)}
.chart .c small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chart .c b{font-size:11.5px;font-weight:600}
.fun{display:flex;flex-direction:column;gap:6px}
.fun div{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.log{font-size:13px}
.log .e{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.log .e:first-child{border-top:0}
.log .e .w{color:var(--muted);font-size:12px}
.diff{font:12px ui-monospace,Menlo,monospace;background:var(--surface2);border-radius:6px;padding:2px 6px;display:inline-block;margin-top:3px}
.diff s{color:var(--red)} .diff ins{color:var(--acc);text-decoration:none;font-weight:600}
.phone-prev{width:300px;max-width:100%;border-radius:28px;background:linear-gradient(160deg,#2b4a3f,#172f28);padding:16px 12px 26px;color:#fff}
.phone-prev .tm{text-align:center;font:600 34px/1 var(--f-head);margin:8px 0 14px;opacity:.9}
.push{background:rgba(255,255,255,.85);color:#111;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:8px;backdrop-filter:blur(10px)}
.push .ic{width:30px;height:30px;border-radius:7px;background:#172f28;display:grid;place-items:center}
.push .ic svg{width:20px;height:15px;fill:#a7d2b9}
.push b{font-size:13px;display:block} .push p{margin:1px 0 0;font-size:13px;line-height:1.3}
.push small{font-size:11px;color:#666;float:right}
.img-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-pick img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:340px;overflow:auto}
.dish-grid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;cursor:pointer;text-align:left;font-size:12px}
.dish-grid button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.dish-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px;background:var(--surface2)}
.chat{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface2);border-radius:12px;max-height:420px;overflow:auto}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13.5px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--acc-soft);border-color:transparent}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.sec-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.mech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mech{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.mech:hover{border-color:var(--acc)}
.mech b{display:block;font-family:var(--f-head);font-size:16px}
.mech span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mech em{font-style:normal;font-size:11.5px;color:var(--acc);display:block;margin-top:6px}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.hero{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11.5px;background:var(--surface);cursor:pointer}
.hero svg{width:100%;height:auto;aspect-ratio:140/160;display:block;border-radius:7px}
.hero.off{opacity:.35}
.sw-c{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);vertical-align:middle}

.grid>.card{margin-top:0}
.g-side{grid-template-columns:minmax(0,1fr) 320px}.g-list{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.dr .kpi b{font-size:21px;overflow-wrap:normal;white-space:nowrap}.dr .kpi b.t{font:700 18px/1.2 var(--f-head);white-space:normal}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 40px rgba(0,0,0,.3)}
  body.nav-open .side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .burger{display:block}
  .top{padding:8px 16px}
