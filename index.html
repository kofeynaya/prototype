<meta charset="utf-8">
<title>Кофейная лояльность</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&family=Dela+Gothic+One&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Макет: одна колонка-телефон (до 440px), сверху демо-полоса, снизу таб-бар.
   Функциональное — чёрно-белое и спокойное; цвет только в «имиджевых» карточках (предложение, цены, награды). */
:root{
  --bg:#f9f9f9; --surface:#ffffff; --ink:#212221; --muted:#6a6e6b; --line:#e2e4e1;
  --green:#172f28; --sage:#a7d2b9; --pink:#ecccce; --cream:#fef2e9; --aqua:#9bd9d9; --teal:#00657f; --blue:#2b2b93;
  --on-color:#212221; --ok:#0d553f; --warn:#a24a1d;
  --tile:#212221; --tile-ink:#f9f9f9;
  --f-body:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191a19; --surface:#232523; --ink:#f3f4f2; --muted:#a3a7a3; --line:#363936;
  --ok:#7fc8a0; --warn:#f0a07a; --tile:#f3f4f2; --tile-ink:#191a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191a19; --surface:#232523; --ink:#f3f4f2; --muted:#a3a7a3; --line:#363936;
  --ok:#7fc8a0; --warn:#f0a07a; --tile:#f3f4f2; --tile-ink:#191a19; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* логотип: маска из PNG, окрашивается currentColor */
.logo{display:inline-block;background:currentColor;-webkit-mask:url(assets/wordmark.png) center/contain no-repeat;mask:url(assets/wordmark.png) center/contain no-repeat;aspect-ratio:1000/121}
.mark{display:inline-block;background:currentColor;-webkit-mask:url(assets/mark.png) center/contain no-repeat;mask:url(assets/mark.png) center/contain no-repeat;aspect-ratio:360/262}

/* демо-полоса */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--green);color:#f9f9f9;font-size:13px}
.demo b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;background:#f9f9f9;color:var(--green);padding:2px 6px;border-radius:4px}
.demo .date{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo button{padding:6px 10px;border-radius:999px;border:1px solid rgba(249,249,249,.4);font-size:13px;white-space:nowrap}
.demo button.primary{background:var(--sage);color:var(--on-color);border-color:var(--sage);font-weight:600}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.screen{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.link{color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* акцидентные цифры: белое на чёрном квадрате */
.tile{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .12em;background:var(--tile);color:var(--tile-ink);font-family:var(--f-num);line-height:1;font-variant-numeric:tabular-nums}
.tiles{display:inline-flex;gap:3px}

/* шапка главной */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hello .logo{width:150px;color:var(--ink)}

/* QR-карта */
.qrcard{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px}
.qrcard .mini{width:64px;height:64px;background:#f9f9f9;border-radius:8px;padding:6px;flex:none}
.qrcard .mini svg{width:100%;height:100%;display:block}
.qrcard .t{flex:1;min-width:0}
.qrcard .bal{font-size:13px;opacity:.75}

/* карточка предложения — «имиджевый» носитель: цвет + пятно */
.offer{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:var(--on-color);display:flex;flex-direction:column;gap:12px;min-height:220px}
.offer .blob{position:absolute;right:-40px;bottom:-50px;width:190px;height:190px;pointer-events:none}
.offer .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.8}
.offer .title{font-size:26px;line-height:1.05;font-weight:700;max-width:75%;text-wrap:balance}
.offer .val{font-family:var(--f-num);font-size:40px;line-height:1}
.offer .meta{font-size:14px;max-width:70%}
.offer .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;position:relative}
.offer .btn{background:var(--on-color);color:#f9f9f9}
.offer .btn.ghost{background:transparent;color:var(--on-color);border-color:var(--on-color)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(33,34,33,.1)}
.chip.on{background:var(--on-color);color:#f9f9f9}
.why{font-size:13px;opacity:.85;position:relative}

/* неделя */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day .dot{width:100%;aspect-ratio:1;max-width:44px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;color:var(--muted)}
.day.done .dot{background:var(--sage);border:0;color:var(--on-color)}
.day.today .dot{border:2px solid var(--ink);color:var(--ink)}
.day.today.done .dot{border:2px solid var(--ink)}
.day.future .dot{opacity:.45}
.goalbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
:root[data-theme="dark"] .goalbar i{background:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .goalbar i{background:var(--sage)}}

/* огоньки по неделям */
.flames{display:flex;gap:6px;flex-wrap:wrap}
.flame{width:30px;height:38px}
.flame path{fill:var(--line)}
.flame.lit path{fill:var(--warn)}

/* лестница наград */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.step .p{font-family:var(--f-num);font-size:18px}
.step .w{font-size:12px;color:var(--muted)}
.step.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.cur .w{color:inherit;opacity:.7}

/* персональные цены */
.prices{display:flex;flex-direction:column;gap:10px}
.price{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.price .sw{width:56px;height:56px;border-radius:12px;display:grid;place-items:center}
.price .sw svg{width:40px;height:40px}
.price .old{text-decoration:line-through;color:var(--muted);font-size:14px}
.price .new{font-family:var(--f-num);font-size:20px}

/* статистика */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:26px;line-height:1.1}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .f{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.funnel .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.funnel .bar i{display:block;height:100%;background:var(--teal)}
.funnel .n{text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .h:last-child{border-bottom:0}
.hist .h .d{font-size:13px;color:var(--muted);grid-column:1/-1}
.save{color:var(--ok)}

/* достижения */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.2}
.badge .b{width:52px;height:52px;display:grid;place-items:center;font-family:var(--f-num);font-size:20px;border-radius:50%}
.badge.off{opacity:.45}
.badge.off .b{background:var(--line)!important;color:var(--muted)!important}

/* «что я о вас знаю» */
.learn{display:flex;flex-direction:column;gap:8px}
.learn .l{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.learn .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.learn .bar i{display:block;height:100%;background:var(--green)}
:root[data-theme="dark"] .learn .bar i{background:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .learn .bar i{background:var(--sage)}}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle:last-child{border-bottom:0}
.toggle input{width:44px;height:26px;accent-color:var(--green)}

/* таб-бар */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}

/* шторка */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;max-height:88%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.goalbar i{transition:none}}
.sheet-x{position:sticky;top:0;align-self:flex-end;z-index:5;width:44px;height:44px;margin:-6px -4px -50px 0;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sheet-x svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.4;fill:none}
.menu{display:flex;flex-direction:column}
.mi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mi .nm{font-size:16px}
.mi .pr{font-size:14px;color:var(--muted)}
.mi .pr .pp{color:var(--ok);font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;line-height:1}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.sum .r.tot{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.bigqr{align-self:center;width:min(78vw,280px);aspect-ratio:1;background:#f9f9f9;border-radius:16px;padding:14px;position:relative}
.bigqr svg{width:100%;height:100%;display:block}
.bigqr .c{position:absolute;inset:0;margin:auto;width:22%;height:22%;background:#212221;border-radius:6px;display:grid;place-items:center}
.bigqr .c .mark{width:70%;color:#f9f9f9}
.timer{text-align:center;font-variant-numeric:tabular-nums}

/* тост */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(408px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast b{font-weight:700}

/* вход */
.auth{flex:1;display:flex;flex-direction:column;gap:24px;padding:40px 16px 24px}
.auth .hero{background:var(--green);color:#f9f9f9;border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;min-height:250px}
.auth .hero .logo{width:200px;color:#f9f9f9}
.auth .hero p{font-size:19px;line-height:1.3;max-width:80%;position:relative}
.auth .hero .blob{position:absolute;right:-50px;bottom:-60px;width:220px;height:220px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:22px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.code input{text-align:center;font-family:var(--f-num);font-size:28px;letter-spacing:.5em;padding:12px 0 12px .5em}
.hint{font-size:14px;color:var(--muted)}
.rules{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px;margin:0}

/* v0.3: подписка, баланс, друг, 6-й, ДР */
.plus-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--blue);color:#f9f9f9;font-size:12px;font-weight:600;white-space:nowrap}
.locked{position:relative}
.locked .veil{filter:blur(3px);opacity:.5;pointer-events:none;user-select:none}
.locked .lockbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.lockbox .ic{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.lockbox .ic svg{width:20px;height:20px;fill:none;stroke:#f9f9f9;stroke-width:2}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);padding:4px 0}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:var(--r);color:var(--on-color);min-height:112px;position:relative;overflow:hidden}
.more button strong{font-size:17px;line-height:1.15;position:relative}
.more button span{font-size:13px;position:relative;opacity:.85}
.more button .blob{width:110px;height:110px;right:-30px;bottom:-40px}
.stamps{display:flex;flex-direction:column;gap:10px}
.stamp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.stamp .dots{display:flex;gap:5px}
.stamp .dots i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:block}
.stamp .dots i.f{background:var(--ink);border-color:var(--ink)}
.stamp .dots i.six{border:1.5px dashed var(--teal);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:var(--teal);width:30px;border-radius:10px}
.stamp .dots i.six.ready{background:var(--teal);color:#f9f9f9;border-style:solid}
.stamp .hint{grid-column:1/-1;font-size:13px;color:var(--muted)}
.stamp .hint.ready{color:var(--teal);font-weight:600}
.bday{border-radius:var(--r);padding:18px;background:var(--blue);color:#f9f9f9;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.bday .big{font-family:var(--f-num);font-size:44px;line-height:1}
.bday .blob{width:160px;height:160px;right:-40px;top:-50px}
.bday > *:not(.blob){position:relative}
.blob{position:absolute;pointer-events:none}
.topups{display:flex;flex-direction:column;gap:10px}
.topup{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.topup .s{font-family:var(--f-num);font-size:22px}
.topup .g{color:var(--ok);font-weight:600}
.topup .n{grid-column:1/-1;font-size:13px;color:var(--muted)}
.friend{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.fsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fsteps span{height:6px;border-radius:3px;background:var(--line)}
.fsteps span.on{background:var(--ok)}
.fsteps span.bad{background:var(--warn)}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.opt input{width:22px;height:22px;accent-color:var(--green);flex:none}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;font-size:14px;align-items:center}
.cmp .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp .y{text-align:center}

/* v0.4: заказ (меню Starter), доставка / самовывоз / за столик, корзина */
:root{--demo-h:44px}
.demo{height:var(--demo-h)}
.topbar{display:flex;align-items:center;gap:10px}
.modechip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-align:left}
.modechip .m{font-weight:600;white-space:nowrap}
.modechip .a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modechip svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.coins{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--sage);display:block}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{scroll-snap-align:start;flex:none}
.story{width:104px;height:136px;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;font-weight:600;line-height:1.15;color:var(--on-color);position:relative;overflow:hidden;text-align:left;border:2px solid var(--ink)}
.story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story span{position:relative}

<script>
/* ===================== Меню (выгружено с kofeynaya.ru, Starter API: menu.js) ===================== */
const CATS = window.MENU_CATS || [];

// Круассана нет в меню Кофейной 5 на сайте — добавлен вручную (участвует в «каждом 6-м»)
MENU.push({id:'x01', n:'Круассан', c:'слоёное тесто, сливочное масло', p:190, b:'', cat:'vipechka_i_deserti', img:'', vars:[{code:'x01',l:'',p:190,w:70,vol:0,g:[]}]});

const findN = n => (MENU.find(m=>m.n===n)||{}).id;
// категории для обучения персонализации
const LCAT = m => ['chernii_kofe','kofeinaya_klassika1','sezonnoe_menyu__kofe','letnee_menyu'].includes(m.cat) ? 'coffee' : m.cat==='kakao' ? 'tea' : m.cat==='vipechka_i_deserti' ? 'pastry' : 'food';
const CAT = {coffee:'кофе', tea:'не кофе и матча', pastry:'выпечка и десерты', food:'еда'};
const MECH = {pct:'скидка в процентах', price:'специальная цена', gift:'подарок', combo:'комбо'};
const SWATCH = {coffee:'var(--cream)', tea:'var(--sage)', pastry:'var(--pink)', food:'var(--aqua)'};
const OFFER_BG = ['var(--sage)','var(--pink)','var(--cream)','var(--aqua)'];
const ID = {cap:findN('Капучино'), latte:findN('Латте'), flat:findN('Флет Уайт'), caesar:findN('Цезарь с курицей'), croissant:'x01', muffin:findN('Апельсиновый маффин'), cookie:findN('Печенье шоколадное')};

const KASSA = [ID.cap, ID.latte, ID.flat, findN('Американо'), findN('Эспрессо'), ID.croissant, ID.muffin, ID.cookie, ID.caesar, findN('Нежные сырники с ягодным конфитюром и сметаной'), findN('Ягодный чизкейк'), findN('Матча латте')].filter(Boolean);

/* Опции — настоящие: размер (варианты блюда) + группы добавок Starter (зерно, молоко, сиропы, посуда…).
   opts = {v: индекс варианта, s: {индекс группы: [индексы добавок]}} */
const hasOpts = m => m.vars.length>1 || m.vars[0].g.length>0;

function bdInfo(){
  const b=S.birth; const today=dateOf(S.day); let best=null;
  for(const y of [today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1]){
    const bd=new Date(y,b.m,b.d); const diff=Math.round((bd-today)/864e5);
    if(!best||Math.abs(diff)<Math.abs(best.diff)) best={diff,age:y-b.y,date:bd};
  }
  best.active=Math.abs(best.diff)<=7; best.pct=S.plus?best.age:BD_FREE;
  best.from=new Date(+best.date-7*864e5); best.to=new Date(+best.date+7*864e5);
  best.capLeft=Math.max(0,BD_CAP-(S.bdUsed[S.day]||0));
  return best;
}

function pickWeighted(obj){ const e=Object.entries(obj); let t=e.reduce((a,[,v])=>a+v,0), r=Math.random()*t; for(const [k,v] of e){ if((r-=v)<=0) return k } return e[0][0]; }
const rnd = a => a[Math.floor(Math.random()*a.length)];
function makeOffer(){
  const explore = Math.random()<0.3;
  const cat = explore ? rnd(Object.keys(CAT)) : pickWeighted(S.w.cat);
  const mech = explore ? rnd(Object.keys(MECH)) : pickWeighted(S.w.mech);
  const item = rnd(MENU.filter(m=>LCAT(m)===cat && m.p<=700));
  const o = {day:S.day, cat, mech, item:item.id, status:'shown', explore, opened:false};
  const nm = item.n;
  if(mech==='pct'){ o.pct=rnd([10,15,20]); o.title=`${nm} −${o.pct}%`; o.meta=`Сегодня со скидкой ${o.pct}%. Одна порция — на кассе или в заказе.`; }
  if(mech==='price'){ o.newPrice=Math.round(item.p*0.8/10)*10; o.title=`${nm} за ${o.newPrice} ₽`; o.meta=`Вместо ${rub(item.p)}. Одна порция, только сегодня.`; }
  if(mech==='gift'){ o.item=ID.cookie; o.cat='pastry'; o.title='Шоколадное печенье в подарок к кофе'; o.meta='Возьмите любой кофе — печенье добавим бесплатно.'; }
  if(mech==='combo'){ const c=rnd([ID.cap,ID.latte,ID.flat]), p=rnd([ID.croissant,ID.muffin]); o.combo=[c,p]; o.item=c;
    const full=byId(c).p+byId(p).p; o.comboPrice=Math.round(full*0.85/10)*10;
    o.title=`${byId(c).n} + ${byId(p).n.toLowerCase()}`; o.meta=`Вместе за ${rub(o.comboPrice)} вместо ${rub(full)}.`; }
  o.why = explore ? 'Пробуем новое: так приложение узнаёт, что вам нравится.' : `Вы часто берёте: ${CAT[o.cat]}. И чаще пользуетесь вариантом «${MECH[mech]}».`;
  o.art = S.day % ARTS.length; o.bg = ARTS[o.art].bg; S.funnel.shown++;
  return o;
}
function makePrices(){
  const cats=Object.entries(S.w.cat).sort((a,b)=>b[1]-a[1]).map(e=>e[0]); const picks=[];
  for(const c of cats){ for(const m of MENU.filter(x=>LCAT(x)===c && x.p<=600 && x.img && x.vars.length===1)){ if(picks.length<3 && Math.random()<0.35 && !picks.includes(m)) picks.push(m) } }
  while(picks.length<3){ const m=rnd(MENU.filter(x=>x.img)); if(!picks.includes(m)) picks.push(m) }
  return picks.map(m=>({item:m.id, price: m.p-Math.max(5,Math.round(m.p*(0.03+Math.random()*0.05)/5)*5)}));
}

}

/* ===================== Расчёт выгоды (касса и онлайн — один движок) =====================
   lines: [{id, qty, sur}] — sur = доплата за опции. На строку одна лучшая скидка; комбо — на свои строки. */
function quote(lines, opt={}){
  let regular=0, offerUsed=false, bdDisc=0; const sixthUsed=[];
  const o=S.offer && S.offer.status==='activated' ? S.offer : null;
  const units=[]; for(const l of lines) for(let i=0;i<l.qty;i++) units.push({id:l.id,sur:l.sur||0});
  const comboLeft = o&&o.mech==='combo' ? [...o.combo] : null;
  let singleLeft = o&&(o.mech==='pct'||o.mech==='price') ? 1 : 0;
  let giftLeft = o&&o.mech==='gift'&&units.some(u=>LCAT(byId(u.id))==='coffee') ? 1 : 0;
  const comboOk = comboLeft && comboLeft.every(c=>units.some(u=>u.id===c));
  const bd=bdInfo(), bdOn=bd.active&&(S.birth.verified||opt.doc||opt.online); let bdLeft=bdOn?bd.capLeft:0;
  const sixLeft={}; SIXTH.forEach(id=>{ if(S.stamps[id]>=5) sixLeft[id]=1 });
  const out=[];
  for(const u of units){
    const m=byId(u.id), full=m.p+u.sur; regular+=full;
    if(comboOk && comboLeft.includes(u.id)){ comboLeft.splice(comboLeft.indexOf(u.id),1); out.push({id:u.id,name:m.n,regular:full,price:null,why:'комбо дня'}); continue; }
    let best={price:full,why:'',k:''};
    const cand=(p,why,k)=>{ if(p<best.price) best={price:p,why,k} };
    const pp=myPrice(u.id); if(pp!=null) cand(pp+u.sur,'★ цена недели','pp');
    if(singleLeft && u.id===o.item) cand(o.mech==='pct'?Math.round(full*(1-o.pct/100)):o.newPrice+u.sur,'предложение дня','offer');
    if(sixLeft[u.id]) cand(Math.round(full*0.7),'6-й −30%','six');
    if(bdLeft>0) cand(full-Math.min(bdLeft,Math.round(full*bd.pct/100)),`день рождения −${bd.pct}%`,'bd');
    if(giftLeft && u.id===ID.cookie) cand(0,'подарок','gift');
    if(best.k==='offer'){ singleLeft=0; offerUsed=true; }
    if(best.k==='gift'){ giftLeft=0; offerUsed=true; }
    if(best.k==='six'){ sixLeft[u.id]=0; sixthUsed.push(u.id); }
    if(best.k==='bd'){ bdLeft-=full-best.price; bdDisc+=full-best.price; }
    out.push({id:u.id,name:m.n,regular:full,price:best.price,why:best.why});
  }
  if(comboOk){ const cl=out.filter(l=>l.price===null); const full=cl.reduce((a,l)=>a+l.regular-0,0);
    cl.forEach(l=>l.price=Math.round(l.regular/full*o.comboPrice)); offerUsed=true; }
  const paid=out.reduce((a,l)=>a+l.price,0);
  const fee=opt.fee||0;
  const bonusSpend = opt.bonus ? Math.min(S.bonus, Math.floor(paid*BONUS_MAX_SHARE)) : 0;
  const after = paid-bonusSpend+fee;
  const walletSpend = opt.wallet ? Math.min(walletTotal(), after) : 0;
  return {lines:out, regular, paid, saved:regular-paid, offerUsed, sixthUsed, bdDisc, bdOn, bdNeedsDoc: bd.active&&!S.birth.verified,
          bonusSpend, walletSpend, fee, card:after-walletSpend, bonus:Math.floor((paid-bonusSpend)*effLevel().p/100)};
}
/* Общая «покупка»: засчитывает день, бонусы, отметки 6-го, ДР, обучение. channel: Касса/Доставка/Самовывоз/За столиком */
function applyPurchase(q, channel, doc){
  const first = !S.visits.includes(S.day); if(first) S.visits.push(S.day);
  S.orders.push({day:S.day, items:q.lines.map(l=>l.id), sum:q.paid-q.bonusSpend+q.fee, saved:q.saved, bonus:q.bonus, bonusSpend:q.bonusSpend, walletSpend:q.walletSpend, ch:channel});
  S.saved+=q.saved; S.bonus+=q.bonus-q.bonusSpend;
  let w=q.walletSpend; const fm=Math.min(S.wallet.money,w); S.wallet.money-=fm; w-=fm; S.wallet.gift-=w;
  if(q.walletSpend) (S.wallet.ops=S.wallet.ops||[]).push({day:S.day,k:'pay',t:`${channel==='Касса'?SHOPS[S.shop].n+' · касса':channel} · ${q.lines.length} поз.`,sum:-q.walletSpend});
  S.pastryCount+=q.lines.filter(l=>LCAT(byId(l.id))==='pastry').length;
  if(q.offerUsed){ S.offer.status='used'; S.funnel.used++; S.mechTried[S.offer.mech]=1; learn(S.offer,'used'); }
  const bought=new Set(q.lines.map(l=>l.id));
  for(const id of SIXTH){ if(!bought.has(id)) continue;
    if(q.sixthUsed.includes(id)){ S.stamps[id]=0; S.stampDay[id]=S.day; }
    else if(S.stampDay[id]!==S.day){ S.stamps[id]=Math.min(5,(S.stamps[id]||0)+1); S.stampDay[id]=S.day; } }
  if(q.bdOn){ if(doc) S.birth.verified=true; S.bdUsed[S.day]=(S.bdUsed[S.day]||0)+q.bdDisc; }
  q.lines.forEach(l=>{ const c=LCAT(byId(l.id)); S.w.cat[c]=+(S.w.cat[c]+0.1).toFixed(2) });
  const got=checkAch();
  const wd=weekDays(weekOf(S.day));
  let msg = first ? `<b>День засчитан: ${wd} из ${S.goal}</b> на этой неделе.` : `<b>Покупка сохранена.</b> Этот день уже был засчитан.`;
  if(q.saved) msg+=` Экономия ${rub(q.saved)}.`;
  msg+=` Бонусы +${q.bonus}${q.bonusSpend?`, списано ${q.bonusSpend}`:''}.`;
  if(got.length) msg+=` Новое достижение: «${got.join('», «')}».`;
  return msg;
}

const lineKey = (id,opts) => id+'|'+JSON.stringify(opts||{});
function addLine(id,opts,silent){
  const m=byId(id); opts=opts||defOpts(m); const k=lineKey(id,opts);
  const l=S.basket.find(x=>x.k===k); if(l) l.qty++; else S.basket.push({k,id,opts,qty:1,sur:optSur(m,opts)});
  save(); if(!silent) refreshBasket(id);
}
function changeLine(k,d){ const l=S.basket.find(x=>x.k===k); if(!l) return; l.qty+=d; if(l.qty<=0) S.basket=S.basket.filter(x=>x!==l); save(); }
function qtyOf(id){ return S.basket.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0); }
function tapAdd(id){ const m=byId(id); if(hasOpts(m)) openProduct(id); else addLine(id); }
function tapMinus(id){ const ls=S.basket.filter(l=>l.id===id); if(!ls.length) return; changeLine(ls[ls.length-1].k,-1); refreshBasket(id); }
function basketCount(){ return S.basket.reduce((a,l)=>a+l.qty,0); }
function basketQuote(extra={}){
  const lines=S.basket.map(l=>({id:l.id,qty:l.qty,sur:l.sur}));
  const sub=S.basket.reduce((a,l)=>a+(byId(l.id).p+l.sur)*l.qty,0);
  if(!S.basket.length) return {...quote([],{}), sub:0};
  const q0=quote(lines,{online:true});
  const fee = S.mode==='delivery' ? DELIVERY.fee(q0.paid) : 0;
  return {...quote(lines,{online:true,fee,...extra}), sub};
}

}

function qrSvg(text, dark='#212221'){
  if(typeof qrcode!=='function') return `<svg viewBox="0 0 10 10"><text x="5" y="6" font-size="2" text-anchor="middle">${text}</text></svg>`;
  const q=qrcode(0,'H'); q.addData(text); q.make(); const n=q.getModuleCount(); let p='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) p+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-label="QR-код гостя"><path fill="${dark}" d="${p}"/></svg>`;
}

/* Шкала цели недели: «кружок — линия — кружок», чтобы понял любой — и ребёнок, и бабушка */
function goalTrack(){
  const w=weekOf(S.day), days=S.visits.filter(v=>weekOf(v)===w).sort((a,b)=>a-b), done=days.length, today=S.visits.includes(S.day);
  const steps=[]; for(let i=0;i<S.goal;i++){
    const ok=i<done, cur=i===done;
    steps.push(`${i?`<span class="gl ${i<=done-1?'on':''}"></span>`:''}<span class="gs ${ok?'ok':cur?'cur':''}"><span class="c">${ok?'✓':i+1}</span><small>${ok?WD[days[i]%7]:cur?(today?'дальше':'сегодня?'):''}</small></span>`);
  }
  const reached=done>=S.goal;
  steps.push(`<span class="gl ${reached?'on':''}"></span><span class="gs prize ${reached?'ok':''}"><span class="c">${flameSvg(reached)}</span><small>${reached?'огонёк!':'награда'}</small></span>`);
  const dow=S.day%7, pct=(dow+0.5)/7*100;
  const line=`<div class="wline"><div class="bar"><i style="width:${pct}%"></i></div>${WD.map((d,i)=>`<span class="tk ${days.some(x=>x%7===i)?'v':''} ${i===dow?'now':''}" style="left:${(i+0.5)/7*100}%"><b></b><em>${d}</em></span>`).join('')}<span class="nowflag" style="left:${pct}%">Сегодня</span></div>`;
  const left=Math.max(0,S.goal-done), daysLeft=6-dow+(today?0:1);
  return `<div class="gtrack ${S.goal>4?'tight':''}">${steps.join('')}</div>${line}
    <p class="small" style="text-align:center">${reached?'<b>Цель недели выполнена!</b> В понедельник — огонёк и выше уровень бонусов.':`<b>Ещё ${left} ${plural(left,'день','дня','дней')}</b> до огонька · на неделе осталось ${daysLeft} ${plural(daysLeft,'день','дня','дней')}`}</p>`;
}
function weekRow(){
  const w=weekOf(S.day);
  return `<div class="week">${WD.map((d,i)=>{ const day=w*7+i; const cls=[S.visits.includes(day)?'done':'', day===S.day?'today':'', day>S.day?'future':''].join(' ');
    return `<div class="day ${cls}"><span class="dot">${S.visits.includes(day)?'✓':dateOf(day).getDate()}</span>${d}</div>` }).join('')}</div>`;
}

let filt={new:false,hit:false,chef:false}, q='';
function menu(){
  const f=Object.entries(filt).filter(([,v])=>v).map(([k])=>k);
  const ok = m => (!f.length || f.includes(m.b)) && (!q || m.n.toLowerCase().includes(q.toLowerCase()));
  const secs = CATS.map(c=>({c, items:MENU.filter(m=>m.cat===c.id && ok(m))})).filter(s=>s.items.length);
  return `<section class="screen" style="gap:16px">
    <div class="topbar">${modeChip()}<button class="iconbtn" onclick="openConditions()" aria-label="Условия">${IC.info}</button></div>

    <div class="catbar"${F(17)}><div class="chips" id="chips">${secs.map(s=>`<button class="catchip" data-c="${s.c.id}" onclick="jump('${s.c.id}')">${s.c.name}</button>`).join('')}</div>
      <button class="iconbtn" onclick="openFilter()" aria-label="Фильтр">${IC.filter}${f.length||q?'<span class="dot"></span>':''}</button></div>
    ${S.plus?`<div class="stack"${F(8)}><h3>★ Ваши цены недели</h3><div class="hscroll">${S.prices.map(p=>{const m=byId(p.item);return `<div class="rec" onclick="openProduct('${m.id}')">${photo(m)}<span class="nm">${m.n}</span>${pillHtml(m)}</div>`}).join('')}</div></div>`:''}
    ${secs.length?secs.map(s=>`<div class="stack" style="gap:12px" id="sec-${s.c.id}">
      <div class="section-h" data-sec="${s.c.id}"><h2>${s.c.name}</h2>${s.c.hours?`<span class="hours">${IC.clock}${s.c.hours}</span>`:''}</div>
      <div class="grid">${s.items.map(cardHtml).join('')}</div></div>`).join('') : `<p class="empty-note">Ничего не нашли. <button class="link" onclick="filt={new:false,hit:false,chef:false};q='';render()">Сбросить фильтр</button></p>`}
  </section>`;
}
function cardHtml(m){
  return `<div class="card" onclick="openProduct('${m.id}')"><div class="wrap">${photo(m)}${loyalTag(m)}</div>
    <span class="nm">${m.n}</span><span class="wt">${wt(m)}</span>${m.c?`<span class="cp">Состав: ${m.c}</span>`:''}${pillHtml(m)}</div>`;
}
function jump(id){ const el=document.getElementById('sec-'+id); if(!el) return; const y=el.getBoundingClientRect().top+scrollY-110; scrollTo({top:y,behavior:'smooth'}); }
function spy(){
  if(tab!=='menu') return; const hs=[...document.querySelectorAll('[data-sec]')]; let cur=hs[0]?.dataset.sec;
  for(const h of hs){ if(h.getBoundingClientRect().top<140) cur=h.dataset.sec; }
  document.querySelectorAll('.catchip').forEach(c=>{ const on=c.dataset.c===cur; if(on&&!c.classList.contains('on')){ c.classList.add('on'); c.scrollIntoView({inline:'center',block:'nearest'}); } else if(!on) c.classList.remove('on'); });
}
addEventListener('scroll',()=>requestAnimationFrame(spy),{passive:true});
function openFilter(){

  const z=DELIVERY.z;
  if(S.mode==='delivery') sheet(`<h2>Условия доставки</h2><div class="list">

let pd=null;
function openProduct(id){ const m=byId(id); pd={id, opts:defOpts(m), qty:1, more:{}}; drawProduct(); }
function drawProduct(){
  const m=byId(pd.id), x=m.vars[pd.opts.v], pp=myPrice(m.id), base=unitPrice(m,pd.opts), unit=pp!=null&&pd.opts.v===0? base-(m.p-pp) : base;
  const six=SIXTH.includes(m.id), st=S.stamps[m.id]||0;
  const sizes = m.vars.length>1 ? `<div class="optgroup"><strong>${m.vt||'Размер'}</strong><div class="seg" style="grid-template-columns:repeat(${m.vars.length},1fr)">${m.vars.map((v,i)=>`<button class="${pd.opts.v===i?'on':''}" onclick="pd.opts=defOpts(byId(pd.id),${i});drawProduct()">${v.l}</button>`).join('')}</div></div>` : '';
  const groups = x.g.map((g,gi)=>{ const one=g.max===1, sel=pd.opts.s[gi]||[], lim=pd.more[gi]?g.v.length:6;
    return `<div class="optgroup"><div class="stack" style="gap:0"><strong>${g.t}</strong>${g.min?`<span class="small muted">Минимум: ${g.min}</span>`:g.max>1&&g.max<g.v.length?`<span class="small muted">Можно выбрать до ${g.max}</span>`:''}</div>
      <div class="list">${g.v.slice(0,lim).map(([n,p],i)=>`<label class="opt" style="border-bottom:1px dashed var(--line)"><span>${n}${p?` <span class="muted">+ ${rub(p)}</span>`:''}</span><input type="${one?'radio':'checkbox'}" name="g${gi}" ${sel.includes(i)?'checked':''} onchange="pickOpt(${gi},${i})"></label>`).join('')}</div>
      ${g.v.length>6&&!pd.more[gi]?`<button class="link" style="align-self:flex-start" onclick="pd.more[${gi}]=1;drawProduct()">Показать ещё ${g.v.length-6}</button>`:''}</div>` }).join('');
  const html=`<div class="pd stack"${F(18)} style="gap:16px">${photo(m)}
    <div class="stack" style="gap:4px"><h2>${m.n}</h2><span class="muted small">${wt(m,pd.opts.v)}${m.b?` · ${{new:'Новое',hit:'Хит! :)',chef:'Выбор шефа'}[m.b]}`:''}</span>${m.c?`<p class="small muted">Состав: ${m.c}</p>`:''}</div>
    ${six?`<div class="hint-chip">${tiles(Math.min(st,5))}<span>${st>=5?'Этот — 6-й: скидка 30% применится в корзине и на кассе.':`Отметок: ${st} из 5. Ещё ${5-st} ${plural(5-st,'день','дня','дней')} с покупкой — и 6-й на 30% дешевле.`}</span></div>`:''}
    ${pp!=null?`<div class="hint-chip" style="background:var(--blue);color:#f9f9f9">★ Ваша цена недели: ${rub(pp)} вместо ${rub(m.p)}</div>`:''}
    ${sizes}${groups}
    <div class="qtyrow" style="position:sticky;bottom:0;background:var(--bg);padding-top:8px"><div class="qty"><button aria-label="Меньше" onclick="pd.qty=Math.max(1,pd.qty-1);drawProduct()">−</button><span>${pd.qty}</span><button aria-label="Больше" onclick="pd.qty++;drawProduct()">+</button></div>
      <button class="btn" style="flex:1" onclick="addFromPd()">${rub(unit*pd.qty)} +</button></div></div>`;
  const ex=document.querySelector('.sheet'); if(ex&&ex.querySelector('.pd')){ const s=ex.scrollTop; ex.innerHTML=SHX+html; ex.scrollTop=s; } else sheet(html);
}
function pickOpt(gi,i){
  const g=byId(pd.id).vars[pd.opts.v].g[gi], a=pd.opts.s[gi]||[];
  if(g.max===1) pd.opts.s[gi]=[i];
  else if(a.includes(i)) pd.opts.s[gi]=a.filter(x=>x!==i);
  else if(a.length>=g.max){ toast(`В группе «${g.t}» можно выбрать не больше ${g.max}.`); }
  else pd.opts.s[gi]=[...a,i];
  drawProduct();
}
function addFromPd(){ for(let i=0;i<pd.qty;i++) addLine(pd.id,JSON.parse(JSON.stringify(pd.opts)),true); const id=pd.id; closeSheet(); refreshBasket(id); toast(`${byId(id).n} — в корзине.`); }

    `<nav class="tabs" aria-label="Разделы"><div class="in">${TABS.map(([id,t,ic])=> id==='qr'
      ? `<button class="qrtab"${F(10)} onclick="openQR()" aria-label="Показать QR на кассе"><span class="ring">${IC.qr.replace('<svg','<svg width="26" height="26" fill="none" stroke-width="2"')}</span>QR</button>`
      : `<button onclick="go('${id}')" ${active===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${t}</button>`).join('')}</div></nav>`;
  if(keep) scrollTo(0,y);
  if(tab==='menu') spy();
}
try{ const t=localStorage.getItem(KEY+'-tab'); if(t && SCREENS[t] && t!=='order') tab=t; }catch(e){}
render(false);
</script>
